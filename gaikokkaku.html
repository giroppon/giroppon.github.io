<title>外骨格ローグ(仮)</title>
<style>
:root{
  --bg:#000; --panel:#000; --text:#fff; --sub:#bdbdbd;
  --accent:#fff; --danger:#fff; --warn:#fff; --border:#fff; --r:6px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --top-gap:32px; /* iOSの上端ぼかし帯。ここに現在地枠を置く */
  color-scheme: dark;
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;background:#000;color:var(--text);font-family:"Courier New",ui-monospace,monospace;line-height:1.45;overscroll-behavior-y:none}
/* iPhone上部のぼかし・グラデーション防止用：セーフエリアを純黒でパキッと覆う */
body::before{
  content:"";position:fixed;top:0;left:0;right:0;height:var(--safe-top);
  background:#000;z-index:20;pointer-events:none;
}
#app{
  max-width:560px;margin:0 auto;height:100%;height:100dvh;
  display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:none;
  padding:var(--safe-top) 12px 0;
}
#app.split{overflow:hidden}
.fixed-top{flex:none}
.locbar{height:var(--top-gap);display:flex;align-items:center;justify-content:center}
.locframe{border:1px solid var(--border);border-radius:var(--r);padding:0 16px;height:24px;line-height:22px;font-size:.8rem;white-space:nowrap}
.scroll-area{
  flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bottom) + 40px);
}
h1{font-size:1.1rem;margin:0 0 4px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0}
.sub{color:var(--sub);font-size:.82rem}
button{
  display:block;width:100%;text-align:left;background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin:6px 0;
  font-family:inherit;font-size:.95rem;cursor:pointer;
}
button:active{background:#333}
button.pressed{background:#666}
button.start.pressed{background:#bbb}
button:disabled{opacity:.35;cursor:default}
button.primary{border-style:double;border-width:3px}
button.start{background:#fff;color:#000;border-color:#fff;font-weight:bold;text-align:center}
input[type=number]{background:#000;color:#fff;border:1px solid var(--border);border-radius:min(var(--r),8px);padding:4px 6px;font-family:inherit;font-size:16px;width:72px}
input[type=range]{accent-color:#fff;width:100%}
button.danger{border-style:double;border-width:3px}
button.ghost{border:1px dashed var(--sub);color:var(--sub)}
.statbar{height:9px;border:1px solid var(--border);background:#000;overflow:hidden;margin-top:3px;border-radius:min(var(--r),6px)}
.statbar>div{height:100%}
.hpfill{background:#fff}
.enfill{background:#fff}
.menubtn{background:#000;border:1px solid transparent;color:var(--text);font-size:1.4rem;cursor:pointer;width:auto;padding:4px 8px;z-index:10}
.center{text-align:center}
.startwrap{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:75vh;position:relative}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px}
.overlaybox{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;width:min(360px,94vw);max-height:88vh;overflow-y:auto}
.tag{display:inline-block;border-radius:min(var(--r),8px);font-size:.75rem;padding:1px 6px;border:1px solid var(--border);color:var(--sub);margin-left:4px}

/* 上部固定エリア */
.sticky-hud{
  background:#000;
  padding-top:2px;
  padding-bottom:4px;
  border-bottom:1px solid #000;
}

/* 左右独立カラムによる均等間隔ステータスレイアウト */
.hud-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 14px;
  align-items:stretch;
  font-size:.86rem;
}
.hud-col-left{
  display:flex;
  flex-direction:column;
  gap:8px;
  min-width:0;
}
.hud-col-right{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:6px;
  min-width:0;
}
.hud-cell{display:flex;flex-direction:column;min-width:0}
.hud-line{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.hud-inline-pair{display:flex;justify-content:space-between;align-items:baseline;gap:6px;white-space:nowrap;font-size:.82rem}

/* メッセージウィンドウ（文字列2行ほどの高さ） */
.msgwin{
  height:3.6rem;
  overflow-y:auto;
  font-size:.88rem;
  padding:7px 10px;
  line-height:1.4;
  margin-bottom:8px;
}

.debug-grid{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;margin:8px 0 12px;font-size:.85rem}

@keyframes shake{
  0%,100%{transform:translateX(0);filter:none}
  15%{transform:translateX(-9px);filter:invert(1)}
  30%{transform:translateX(9px);filter:invert(1)}
  45%{transform:translateX(-7px);filter:none}
  60%{transform:translateX(6px)}
  80%{transform:translateX(-3px)}
}
.shake{animation:shake .45s linear}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===================== データ =====================
const MAX_DEPTH = 12;

const ITEMS = {
  club:{name:'棍棒',type:'weapon',power:3,price:10,maxDur:20},
  dagger:{name:'ダガー',type:'weapon',power:4,price:15,maxDur:15},
  sword:{name:'鋼の剣',type:'weapon',power:7,price:40,maxDur:25},
  robe:{name:'ローブ',type:'armor',power:2,price:12,maxDur:20},
  exo:{name:'外骨格',type:'armor',power:4,price:25,maxDur:30},
  healPotion:{name:'HP回復薬',type:'potion',price:15,effect:'heal'},
  capsule:{name:'薬',type:'potion',price:15,effect:'random'},
  idScroll:{name:'鑑定スキャナー',type:'tool',price:20,effect:'identify'},
  curseFix:{name:'デバッグツール',type:'tool',price:50,effect:'removeCurse'},
  energyPotion:{name:'EN回復薬',type:'potion',price:20,effect:'energy'},
  hpSeed:{name:'HP強化パーツ',type:'seed',price:40,effect:'seedHp'},
  enSeed:{name:'エネルギー強化パーツ',type:'seed',price:40,effect:'seedEn'},
  skillSeed:{name:'技能強化パーツ',type:'seed',price:40,effect:'seedSkill'},
  junk:{name:'ガラクタ',type:'junk',price:1,fixed:true},
};
const DEFAULT_SHOP = ['club','robe','healPotion'];

const MONSTERS=[
 {name:'錆びたドローン',hp:10,atk:3,def:0,gold:[4,10],undead:false,min:1,max:4},
 {name:'徘徊ワーム',hp:15,atk:4,def:1,gold:[6,14],undead:false,min:1,max:5},
 {name:'腐食ゾンビ外骨格',hp:18,atk:4,def:2,gold:[8,16],undead:true,min:2,max:7},
 {name:'バグ化メカ',hp:24,atk:6,def:4,gold:[12,24],undead:false,min:3,max:9},
 {name:'深層ガーディアン',hp:38,atk:9,def:6,gold:[20,40],undead:false,min:5,max:11},
];

// 12階（最深部）のラスボス（ATK100以上・DEF100以上が攻略基準）
const FINAL_BOSS = {
  name:'深淵の統括機【ラスボス】',
  hp:600, maxHp:600,
  atk:115, def:95,
  goldMin:500, goldMax:500,
  undead:false, isBoss:true
};

// ===================== 状態 =====================
let uidSeed = 1;
function uid(){ return uidSeed++; }
let S = loadState();
if(S){
  uidSeed = S.uid || uidSeed;
  if(S.statusCursed) delete S.statusCursed;
  [...(S.backpack||[]), S.equipment?.weapon, S.equipment?.armor].filter(Boolean).forEach(it=>{
    if(it.junk) convertToJunk(it);
  });
} else {
  S = freshState();
}

let toastMsg='';
let msgFresh=false;
document.addEventListener('click',e=>{ if(e.target.closest && e.target.closest('button')) msgFresh=true; },true);

// 10msタイプライター演出管理
let twTimer = null;
let twLastTarget = '';
let twCurrentText = '';

function triggerTypewriter(fullText){
  if(fullText === twLastTarget) return;
  twLastTarget = fullText;
  if(twTimer){ clearInterval(twTimer); twTimer = null; }
  if(!fullText){
    twCurrentText = '';
    return;
  }
  let idx = 0;
  twCurrentText = '';
  twTimer = setInterval(()=>{
    idx++;
    twCurrentText = fullText.slice(0, idx);
    const el = document.getElementById('msgLatest');
    if(el) el.textContent = twCurrentText;
    const box = document.getElementById('msgBox');
    if(box) box.scrollTop = box.scrollHeight;
    if(idx >= fullText.length){
      clearInterval(twTimer);
      twTimer = null;
    }
  }, 10);
}

function toast(msg){
  if(S.run){ pushLog(msg); render(); return; }
  toastMsg=msg; render();
}

function gotoScreen(scr, locMsg){
  S.screen = scr;
  if(locMsg){
    if(S.run) pushLog(locMsg);
    else toastMsg = locMsg;
  }
  render();
}

function freshState(){
  return {
    uid:1,
    hp:30,maxHp:30,energy:20,maxEnergy:20,atk:5,def:2,skill:5,
    gold:80,debt:0,maxDepthReached:1,
    backpack:[genInstance('club',1,true),genInstance('robe',1,true),genInstance('healPotion',1,true)],
    backpackLimit:10,
    equipment:{weapon:null,armor:null},
    shop:{},
    screen:'start', menuOpen:false, radius:6,
    run:null,
  };
}
function saveState(){ S.uid=uidSeed; localStorage.setItem('exo_rogue_save', JSON.stringify(S)); }
function loadState(){ try{ const raw=localStorage.getItem('exo_rogue_save'); return raw?JSON.parse(raw):null; }catch(e){ return null; } }

// ===================== アイテム生成・変換 =====================
function convertToJunk(it){
  it.key = 'junk';
  it.junk = true;
  it.identified = true;
  it.cursed = false;
  it.cursedRevealed = false;
  it.locked = false;
  delete it.level;
  delete it.durability;
  delete it.maxDurability;
  delete it.effect;
}

function genInstance(key, depth, guaranteedSafe){
  if(key === 'junk'){
    const it = {uid:uid(), key:'junk'};
    convertToJunk(it);
    return it;
  }
  const base = ITEMS[key];
  const it = {uid:uid(), key};
  if(base.type==='weapon'||base.type==='armor'){
    it.level = Math.max(1, Math.round(depth*(0.6+Math.random()*0.8)));
    it.maxDurability = Math.round(base.maxDur*(1+(it.level-1)*0.3));
    it.durability = it.maxDurability;
    it.junk=false;
    it.cursed = guaranteedSafe ? false : Math.random()<0.15;
    it.cursedRevealed=false; it.locked=false;
  }
  if(base.fixed){ it.identified=true; }
  else { it.identified = guaranteedSafe ? true : Math.random()<0.2; }
  if(it.cursed){ it.identified=false; it.cursedRevealed=false; }
  if(base.type==='potion' && base.effect==='random'){
    it.effect = Math.random()<0.55 ? 'heal' : 'cureCurse';
  } else if(base.effect && base.effect!=='random'){
    it.effect = base.effect;
  }
  return it;
}
function setLevel(it,L){ const b=ITEMS[it.key]; it.level=L; it.maxDurability=Math.round(b.maxDur*(1+(L-1)*0.3)); it.durability=it.maxDurability; }
function identifyItem(it){ it.identified=true; if(it.cursed) it.cursedRevealed=true; }
function uncurseItem(it){
  if(!it.cursed) return false;
  if(it.locked){ it.locked=false; if(ITEMS[it.key].type==='weapon') S.atk+=2; else S.def+=1; }
  it.cursed=false; it.cursedRevealed=false; return true;
}
function durBar(it){
  if(it.junk || it.key==='junk') return '';
  const t=ITEMS[it.key].type; if(t!=='weapon'&&t!=='armor') return '';
  const r=Math.max(0,Math.min(100,Math.round(it.durability/it.maxDurability*100)));
  return `<div class="statbar" style="margin-top:4px"><div class="hpfill" style="width:${r}%"></div></div>`;
}
function dispName(it){
  if(it.junk || it.key==='junk') return 'ガラクタ';
  const b=ITEMS[it.key];
  // 不確定名の統一ルール
  if(!it.identified){
    if(b.type==='seed' || b.type==='tool') return '謎の端末';
    if(b.type==='potion') return '謎の液体';
    return '謎の'+b.name;
  }
  let base=b.name;
  if(it.key==='capsule') base=({heal:'HP回復薬',cureCurse:'解呪薬'})[it.effect]||b.name;
  let n = base;
  if(b.type==='weapon'||b.type==='armor') n+=' Lv'+it.level;
  if(it.cursedRevealed) n+='(呪)';
  return n;
}
function refPrice(it){
  if(it.junk || it.key==='junk') return 1;
  const b=ITEMS[it.key];
  if(b.type==='weapon'||b.type==='armor'){
    return priceFor(it.key, it.level||1);
  }
  return b.price;
}
function priceFor(key,level){ return Math.round(ITEMS[key].price*(1+(level-1)*0.5)); }

// ===================== 画面描画 =====================
const app=document.getElementById('app');
// ピンチ拡大防止（iOS）
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
// ボタン押下フィードバック（触れた瞬間に一瞬グレー）
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest&&e.target.closest('button');
  if(!b||b.disabled) return;
  b.classList.add('pressed');
  setTimeout(()=>b.classList.remove('pressed'),150);
},{passive:true});
document.addEventListener('pointercancel',()=>{
  document.querySelectorAll('button.pressed').forEach(b=>b.classList.remove('pressed'));
},{passive:true});
function locationName(){
  const sc = S.screen==='items' ? (S.itemCtx==='town' ? 'town' : 'dungeon') : S.screen;
  if(sc==='dungeon' || sc==='combat') return S.run && S.run.depth ? 'ダンジョン 深層'+S.run.depth : 'ダンジョン';
  if(sc.indexOf('shop')===0) return '店';
  return ({town:'町',church:'教会',lounge:'ラウンジ',inn:'宿',dungeonSetup:'ダンジョン入口'})[sc] || '';
}
function render(){
  applyRadius();
  if(S.screen==='equip') S.screen='town';
  let html='';
  if(S.screen==='start') html=renderStart();
  else if(S.screen==='town') html=renderTown();
  else if(S.screen==='church') html=renderChurch();
  else if(S.screen==='lounge') html=renderLounge();
  else if(S.screen==='shopMenu') html=renderShopMenu();
  else if(S.screen==='shopBuy') html=renderShopBuy();
  else if(S.screen==='shopSell') html=renderShopSell();
  else if(S.screen==='shopIdentify') html=renderShopIdentify();
  else if(S.screen==='shopRepair') html=renderShopRepair();
  else if(S.screen==='inn') html=renderInn();
  else if(S.screen==='dungeonSetup') html=renderDungeonSetup();
  else if(S.screen==='dungeon') html=renderDungeon();
  else if(S.screen==='combat') html=renderCombat();
  else if(S.screen==='items') html=renderItems();
  else if(S.screen==='gameover') html=renderGameover();

  const prevScroll = app.querySelector('.scroll-area');
  const prevTop = prevScroll ? prevScroll.scrollTop : 0;
  app.innerHTML = html + ((S.menuOpen && S.screen==='start') ? renderMenuOverlay() : '');
  const hud = app.querySelector('.sticky-hud');
  app.classList.toggle('split', !!hud);
  if(hud){
    const fixedTop = document.createElement('div'); fixedTop.className = 'fixed-top';
    const loc = document.createElement('div'); loc.className = 'locbar';
    loc.innerHTML = '<div class="locframe">'+locationName()+'</div>';
    fixedTop.appendChild(loc);
    const scrollArea = document.createElement('div'); scrollArea.className = 'scroll-area';
    const kids = Array.from(app.childNodes);
    const idx = kids.indexOf(hud);
    kids.forEach((n,i)=>{ (i<=idx ? fixedTop : scrollArea).appendChild(n); });
    app.appendChild(fixedTop); app.appendChild(scrollArea);
    scrollArea.scrollTop = prevTop;
  }

  if(S.screen !== 'start'){
    const lines = getMsgLines();
    const latest = lines.length ? lines[lines.length - 1] : '';
    triggerTypewriter(latest);
    const el = document.getElementById('msgLatest');
    if(el) el.textContent = (latest === twLastTarget) ? twCurrentText : latest;
    const box = document.getElementById('msgBox');
    if(box) box.scrollTop = box.scrollHeight;
  }

  try{ saveState(); }catch(e){}
}

// スタートメニュー「≡」（デバッグ機能＋設定）
function renderMenuOverlay(){
  return `<div class="overlay" onclick="toggleMenu()">
    <div class="overlaybox" onclick="event.stopPropagation()">
      <div class="row"><span>角丸(px)</span><input id="radNum" type="number" min="0" max="40" value="${S.radius==null?6:S.radius}" oninput="setRadius(this.value,'radRange')"></div>
      <input id="radRange" type="range" min="0" max="40" value="${S.radius==null?6:S.radius}" oninput="setRadius(this.value,'radNum')" style="margin:6px 0 12px">

      <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:6px">
        <div class="sub" style="margin-bottom:6px">デバッグ：パラメータ変更</div>
        <div class="debug-grid">
          <span>HP</span><input type="number" value="${S.hp}" onchange="setDebugStat('hp',this.value)">
          <span>最大HP</span><input type="number" value="${S.maxHp}" onchange="setDebugStat('maxHp',this.value)">
          <span>エネルギー</span><input type="number" value="${S.energy}" onchange="setDebugStat('energy',this.value)">
          <span>最大エネルギー</span><input type="number" value="${S.maxEnergy}" onchange="setDebugStat('maxEnergy',this.value)">
          <span>素ATK</span><input type="number" value="${S.atk}" onchange="setDebugStat('atk',this.value)">
          <span>素DEF</span><input type="number" value="${S.def}" onchange="setDebugStat('def',this.value)">
          <span>技能</span><input type="number" value="${S.skill}" onchange="setDebugStat('skill',this.value)">
          <span>所持金(G)</span><input type="number" value="${S.gold}" onchange="setDebugStat('gold',this.value)">
          <span>到達深層</span><input type="number" min="1" max="${MAX_DEPTH}" value="${S.maxDepthReached}" onchange="setDebugStat('maxDepthReached',this.value)">
        </div>
      </div>

      <button class="danger" onclick="resetGame()">記録を消す</button>
      <button class="ghost" onclick="toggleMenu()">閉じる</button>
    </div></div>`;
}
function setDebugStat(key, val){
  const v = Math.max(0, Math.round(Number(val)||0));
  if(key==='maxDepthReached') S[key] = Math.max(1, Math.min(MAX_DEPTH, v));
  else S[key] = v;
  if(key==='maxHp' && S.hp>S.maxHp) S.hp=S.maxHp;
  if(key==='maxEnergy' && S.energy>S.maxEnergy) S.energy=S.maxEnergy;
  render();
}
function applyRadius(){ document.documentElement.style.setProperty('--r',(S.radius==null?6:S.radius)+'px'); }
function setRadius(v,otherId){
  v=Math.max(0,Math.min(40,Math.round(Number(v)||0)));
  S.radius=v; applyRadius();
  const o=document.getElementById(otherId); if(o) o.value=v;
  try{ saveState(); }catch(e){}
}
function toggleMenu(){ S.menuOpen=!S.menuOpen; render(); }
function resetGame(){ localStorage.removeItem('exo_rogue_save'); S=freshState(); uidSeed=1; twLastTarget=''; render(); }

function renderStart(){
  return `<div class="startwrap">
    <h1 style="font-size:1.6rem">外骨格ローグ(仮)</h1>
    <p class="sub">金こそがすべて。深層で稼ぎ、街で拡張せよ。</p>
    <button class="start" style="max-width:220px" onclick="gotoScreen('town','【町】冒険の拠点。設備を整えよう。')">ゲームを始める</button>
  </div><button class="menubtn" style="position:fixed;top:calc(var(--safe-top) + 8px);right:10px" onclick="toggleMenu()">≡</button>`;
}

function getMsgLines(){
  if(S.run) return S.run.log.slice(-2);
  if(toastMsg) return [toastMsg];
  return [];
}

function msgWindow(){
  const lines = getMsgLines();
  if(lines.length === 0){
    return `<div class="panel msgwin" id="msgBox"><div id="msgLatest"></div></div>`;
  }
  if(lines.length === 1){
    return `<div class="panel msgwin" id="msgBox"><div id="msgLatest">${lines[0]}</div></div>`;
  }
  return `<div class="panel msgwin" id="msgBox">
    <div class="sub">${lines[0]}</div>
    <div id="msgLatest">${lines[1]}</div>
  </div>`;
}

// 左右独立カラムによる均等間隔ステータス＋メッセージウィンドウ
function hudBlock(){
  const hpP = Math.max(0, Math.min(100, Math.round(S.hp / Math.max(1, S.maxHp) * 100)));
  const enP = Math.max(0, Math.min(100, Math.round(S.energy / Math.max(1, S.maxEnergy) * 100)));

  // 武器耐久バー（ATKの下）
  const w = S.equipment.weapon;
  let wDurP = 100;
  if(w && !w.junk && w.key!=='junk'){
    wDurP = Math.max(0, Math.min(100, Math.round(w.durability / Math.max(1, w.maxDurability) * 100)));
  }

  // 防具耐久バー（DEFの下）
  const a = S.equipment.armor;
  let aDurP = 100;
  if(a && !a.junk && a.key!=='junk'){
    aDurP = Math.max(0, Math.min(100, Math.round(a.durability / Math.max(1, a.maxDurability) * 100)));
  }

  const turnsDisp = S.run ? S.run.turns : 0;
  const retCostDisp = S.run ? returnCost() : 0;

  return `<div class="sticky-hud">
    <div class="panel" id="playerBox" style="margin-bottom:8px">
      <div class="hud-grid">
        <!-- 左列：HP・ATK・DEF を均等な間隔で縦並び -->
        <div class="hud-col-left">
          <div class="hud-cell">
            <div class="hud-line"><span>HP</span><span>${S.hp}/${S.maxHp}</span></div>
            <div class="statbar"><div class="hpfill" style="width:${hpP}%"></div></div>
          </div>
          <div class="hud-cell">
            <div class="hud-line"><span>ATK</span><span>${atkTotal()}</span><span class="sub" style="font-size:.74rem">(${S.atk}+${weaponPower()})</span></div>
            <div class="statbar"><div class="hpfill" style="width:${wDurP}%"></div></div>
          </div>
          <div class="hud-cell">
            <div class="hud-line"><span>DEF</span><span>${defTotal()}</span><span class="sub" style="font-size:.74rem">(${S.def}+${armorPower()})</span></div>
            <div class="statbar"><div class="hpfill" style="width:${aDurP}%"></div></div>
          </div>
        </div>

        <!-- 右列：EN（＋探索・帰還コスト）・所持金・技能 -->
        <div class="hud-col-right">
          <div class="hud-cell">
            <div class="hud-line"><span>EN</span><span>${S.energy}/${S.maxEnergy}</span></div>
            <div class="statbar"><div class="enfill" style="width:${enP}%"></div></div>
            <div class="hud-inline-pair" style="margin-top:5px">
              <span>探索${turnsDisp}</span>
              <span>帰還コスト${retCostDisp}</span>
            </div>
          </div>
          <div class="hud-cell">
            <div class="hud-line"><span>所持金</span><span style="font-weight:bold">${S.gold}G</span></div>
          </div>
          <div class="hud-cell" style="padding-bottom:2px">
            <div class="hud-line"><span>技能</span><span>${S.skill}</span></div>
          </div>
        </div>
      </div>
    </div>
    ${msgWindow()}
  </div>`;
}

function renderTown(){
  return hudBlock()+
    `<div class="panel">
      <button onclick="gotoScreen('shopMenu','【商店】武器や道具の売買・修理ができる。')">商店</button>
      <button onclick="gotoScreen('inn','【宿】体を休めてHPやエネルギーを回復できる。')">宿(HP・エネルギー回復)</button>
      <button onclick="openItems('town')">持ち物</button>
      <button onclick="gotoScreen('church','【教会】装備の呪いを解いてもらえる。')">教会(解呪)</button>
      <button class="primary" onclick="gotoScreen('dungeonSetup','【ダンジョン入口】潜る深層を選択しよう。')">ダンジョンへ</button>
      <button class="ghost" onclick="S.screen='start';render()">スタート画面に戻る</button>
    </div>`;
}

// ---- 教会 ----
function churchCost(){ return 30; }
function cursedList(){
  return [S.equipment.weapon,S.equipment.armor,...S.backpack].filter(it=>it&&!it.junk&&it.cursed&&(it.cursedRevealed||it.locked));
}
function renderChurch(){
  const cost=churchCost();
  const rows=cursedList().map(it=>`<button onclick="churchUncurse(${it.uid})">${dispName(it)}${isEquipped(it)?' <span class="tag">装備中</span>':''} <span class="tag">${cost}G</span></button>`).join('');
  return hudBlock()+`<div class="panel"><p class="sub">呪われた武器・防具を解呪できます。</p>${rows||'<p class="sub">解呪が必要な装備はありません</p>'}
    <button class="ghost" onclick="gotoScreen('town','【町】に戻った。')">戻る</button></div>`;
}
function churchUncurse(u){
  const it=findAnyItem(u); if(!it) return;
  const cost=churchCost();
  if(S.gold<cost){ toast('所持金が足りません('+cost+'G必要)'); return; }
  S.gold-=cost; uncurseItem(it);
  toast(dispName(it)+'の呪いが解けた。');
}

// ---- 商店メニュー ----
function renderShopMenu(){
  return hudBlock()+`<div class="panel">
    <button onclick="gotoScreen('shopBuy','【商店 - 買う】品揃えを確認する。')">買う</button>
    <button onclick="gotoScreen('shopSell','【商店 - 売る】不要な品を売却する。')">売る</button>
    <button onclick="gotoScreen('shopIdentify','【商店 - 鑑定】確実にアイテムを鑑定する。')">鑑定</button>
    <button onclick="gotoScreen('shopRepair','【商店 - 修理】すり減った装備を直す。')">修理</button>
    <button class="ghost" onclick="gotoScreen('town','【町】に戻った。')">店を出る</button></div>`;

// ---- 買う ----
function isInfinite(k){ const t=ITEMS[k].type; return DEFAULT_SHOP.includes(k) && t!=='weapon' && t!=='armor'; }
function renderShopBuy(){
  const keys = Array.from(new Set([...DEFAULT_SHOP, ...Object.keys(S.shop)])).filter(k=>ITEMS[k] && k!=='junk');
  let rows = keys.map(k=>{
    const b=ITEMS[k], cat=S.shop[k], inf=isInfinite(k);
    if(!inf && !cat) return '';
    const stock = inf ? '∞' : cat.stock;
    const isEq = (b.type==='weapon'||b.type==='armor');
    const lv = isEq && cat ? (cat.level||1) : 1;
    const price = priceFor(k,lv);
    const label = isEq ? `${b.name} Lv${lv}` : b.name;
    return `<button ${stock===0?'disabled':''} onclick="buyItem('${k}')">${label} <span class="tag">${price}G</span> <span class="tag">在庫${stock}</span></button>`;
  }).join('');
  return hudBlock()+`<div class="panel">${rows||'<p class="sub">商品がありません</p>'}
    <button class="ghost" onclick="gotoScreen('shopMenu','【商店】カウンターに戻った。')">戻る</button></div>`;
}
function buyItem(key){
  if(key==='junk') return;
  const cat=S.shop[key], inf=isInfinite(key);
  if(!inf && (!cat||cat.stock<=0)){ toast('在庫切れです'); return; }
  const isEq=(ITEMS[key].type==='weapon'||ITEMS[key].type==='armor');
  const lv = isEq && cat ? (cat.level||1) : 1;
  const price=priceFor(key,lv);
  if(S.gold<price){ toast('所持金が足りません'); return; }
  if(S.backpack.length>=S.backpackLimit){ toast('バックパックが満杯です'); return; }
  S.gold-=price; if(!inf) cat.stock-=1;
  const ni=genInstance(key, 1, true);
  if(isEq) setLevel(ni,lv);
  S.backpack.push(ni);
  toast(dispName(ni)+'を購入した。');
}

// ---- 売る ----
function renderShopSell(){
  if(S.backpack.length===0) return hudBlock()+`<div class="panel"><p class="sub">売るものがありません</p><button class="ghost" onclick="gotoScreen('shopMenu','【商店】カウンターに戻った。')">戻る</button></div>`;
  const rows = S.backpack.map(it=>{
    const p = sellPrice(it);
    return `<button onclick="sellItem(${it.uid})">${dispName(it)} <span class="tag">${p}G</span></button>`;
  }).join('');
  return hudBlock()+`<div class="panel">${rows}<button class="ghost" onclick="gotoScreen('shopMenu','【商店】カウンターに戻った。')">戻る</button></div>`;
}
function sellPrice(it){
  if(it.junk || it.key==='junk') return 1;
  if(!it.identified) return 1;
  const b=ITEMS[it.key];
  if(b.type!=='weapon'&&b.type!=='armor') return Math.max(1,Math.round(b.price*0.5));
  let p=Math.round(refPrice(it)*0.5);
  const ratio = it.durability/it.maxDurability;
  p = Math.round(p*(0.5+ratio*0.5));
  return Math.max(1,p);
}
function sellItem(u){
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0)return;
  const it=S.backpack[idx]; const price=sellPrice(it);
  const isJunkItem = (it.junk || it.key==='junk');
  S.gold+=price; S.backpack.splice(idx,1);
  if(!isJunkItem){
    const cat=S.shop[it.key]||{level:1,stock:0};
    const isEq=(ITEMS[it.key].type==='weapon'||ITEMS[it.key].type==='armor');
    cat.level = isEq ? Math.max(cat.level||1, it.level||1) : 1;
    cat.stock+=1;
    S.shop[it.key]=cat;
    toast(dispName(it)+'を'+price+'Gで売却した。');
  } else {
    toast('ガラクタを'+price+'Gで処分した（棚には並ばない）。');
  }
}
function identifyCost(it){ return Math.max(1, Math.round(refPrice(it)*0.5)); }

// ---- 鑑定（商店） ----
function renderShopIdentify(){
  const targets = S.backpack.filter(i=>!i.identified && !i.junk && i.key!=='junk');
  if(targets.length===0) return hudBlock()+`<div class="panel"><p class="sub">未鑑定のアイテムがありません</p><button class="ghost" onclick="gotoScreen('shopMenu','【商店】カウンターに戻った。')">戻る</button></div>`;
  const rows = targets.map(it=>{
    const cost = identifyCost(it);
    return `<button onclick="shopIdentify(${it.uid})">${dispName(it)} <span class="tag">${cost}G</span></button>`;
  }).join('');
  return hudBlock()+`<div class="panel">${rows}<button class="ghost" onclick="gotoScreen('shopMenu','【商店】カウンターに戻った。')">戻る</button></div>`;
}
function shopIdentify(u){
  const it=S.backpack.find(i=>i.uid===u); if(!it)return;
  const cost=identifyCost(it);
  if(S.gold<cost){toast('所持金が足りません');return;}
  S.gold-=cost; identifyItem(it);
  toast(dispName(it)+(it.cursed?'…呪われている！':'だと判明した。'));
}

// ---- 修理 ----
function renderShopRepair(){
  const targets = S.backpack.filter(i=>!i.junk && i.key!=='junk' && (ITEMS[i.key].type==='weapon'||ITEMS[i.key].type==='armor') && i.durability<i.maxDurability);
  const eq = [S.equipment.weapon,S.equipment.armor].filter(i=>i && !i.junk && i.key!=='junk' && i.durability<i.maxDurability);
  const all=[...targets,...eq];
  if(all.length===0) return hudBlock()+`<div class="panel"><p class="sub">修理可能な装備がありません</p><button class="ghost" onclick="gotoScreen('shopMenu','【商店】カウンターに戻った。')">戻る</button></div>`;
  const rows = all.map(it=>{
    const cost = repairCost(it);
    return `<button onclick="repairItem(${it.uid})">${dispName(it)} 耐久${it.durability}/${it.maxDurability} <span class="tag">${cost}G</span>${durBar(it)}</button>`;
  }).join('');
  return hudBlock()+`<div class="panel">${rows}<button class="ghost" onclick="gotoScreen('shopMenu','【商店】カウンターに戻った。')">戻る</button></div>`;
}
function repairCost(it){
  const ratio=Math.max(0,Math.min(1,it.durability/it.maxDurability));
  return Math.max(1, Math.round(refPrice(it)*0.5*(1-ratio)));
}
function findAnyItem(u){
  let it=S.backpack.find(i=>i.uid===u); if(it)return it;
  if(S.equipment.weapon&&S.equipment.weapon.uid===u) return S.equipment.weapon;
  if(S.equipment.armor&&S.equipment.armor.uid===u) return S.equipment.armor;
  return null;
}
function repairItem(u){
  const it=findAnyItem(u); if(!it || it.junk || it.key==='junk')return;
  const cost=repairCost(it);
  if(S.gold<cost){toast('所持金が足りません');return;}
  S.gold-=cost; it.durability=it.maxDurability;
  toast(dispName(it)+'を修理した。');
}

function equip(u){
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0)return;
  const it=S.backpack[idx];
  if(it.junk || it.key==='junk'){ toast('ガラクタは装備できません'); return; }

  const prev=S.equipment[slot];
  if(prev&&prev.locked){ toast('いま装備している物が呪いで外せません'); return; }
  S.backpack.splice(idx,1);
  if(prev) S.backpack.push(prev);
  S.equipment[slot]=it;
  if(it.cursed && !it.locked){
    it.identified=true; it.cursedRevealed=true; it.locked=true;

  }

}
function afterEquipChange(){
  if(S.screen==='items'){ S.itemSel=null; if(S.itemCtx==='combat'&&S.combat) S.screen='combat'; }
  render();
}
function unequip(slot){

  if(it.locked){ toast('呪いで外せません'); return; }

// ===================== ダンジョン =====================
function renderDungeonSetup(){
  const maxD=Math.min(S.maxDepthReached, MAX_DEPTH);
  let opts='';
  for(let d=1; d<=maxD; d++){
    const bossTag = (d===MAX_DEPTH) ? ' <span class="tag">最深部</span>' : '';
    opts+=`<button ${S.energy>d?'':'disabled'} onclick="startDungeon(${d})">深層${d}から潜る${bossTag} <span class="tag">エネルギー${d}</span></button>`;
  }
  return hudBlock()+`<div class="panel">
    <p class="sub">エネルギーが尽きる、または戦闘に負けると回収業者に運ばれます(所持金が半分になり、HP・エネルギーは全回復)。</p>
    <p class="sub">潜る階層と同じ量のエネルギーを消費します（最深部：深層${MAX_DEPTH}）。</p>
    ${opts}
    <button class="ghost" onclick="gotoScreen('town','【町】に戻った。')">戻る</button></div>`;
}
function startDungeon(depth){
  if(S.energy<=depth){ toast('エネルギーが足りません'); return; }
  S.energy-=depth;
  const msg = (depth===MAX_DEPTH)
    ? `【最深部 深層${depth}】重苦しい空気の中、深淵の統括機が待ち構えている気配がする…`
    : `【ダンジョン 深層${depth}】に突入した。`;
  S.run={depth, turns:0, encounter:null, bossDefeated:false, log:[msg]};
  S.screen='dungeon'; render();
}
function pushLog(msg){
  if(msgFresh){ S.run.log=[]; msgFresh=false; }
  S.run.log.push(msg); if(S.run.log.length>6) S.run.log.shift();
}

function renderDungeon(){
  const r=S.run;
  let enc='';
  if(r.encounter) enc = renderEncounter();
  else enc = `<button class="primary" onclick="doSearch()">周囲を探す <span class="tag">エネルギー1</span></button>
    <button onclick="doReturn()">帰還する <span class="tag">エネルギー${returnCost()}</span></button>`;
  return hudBlock()+
     `<div class="panel">${enc}<button class="ghost" onclick="openItems('dungeon')">持ち物</button></div>`;
}
function returnCost(){ return S.run.depth + Math.floor(S.run.turns/5); }

function doSearch(){
  const cost=1;
  S.energy-=cost; S.run.turns++;
  if(S.energy<=0){ pushLog('エネルギーが尽きて倒れた…'); collapse(); return; }

  const isBottom = (S.run.depth >= MAX_DEPTH);
  const r=Math.random();

  if(isBottom){
    if(!S.run.bossDefeated && (S.run.turns >= 2 && r < 0.45)){
      const boss = Object.assign({}, FINAL_BOSS);
      S.run.encounter={type:'enemy', mon:boss};
      pushLog('最深部の奥で【'+boss.name+'】が起動した！！');
      render(); return;
    }
    if(r<0.38){ pushLog('【最深部 深層'+S.run.depth+'】何も見つからなかった。'); S.run.encounter=null; }
    else if(r<0.60){ const it=genInstance(pickRandomDropKey(),S.run.depth); S.run.encounter={type:'item', item:it}; pushLog(dispName(it)+'が落ちている。'); }
    else if(r<0.76){ S.run.encounter={type:'trap'}; pushLog('宝箱を見つけた。罠があるかもしれない。'); }
    else {
      const mon = (!S.run.bossDefeated && Math.random()<0.5) ? Object.assign({}, FINAL_BOSS) : spawnMonster(S.run.depth);
      S.run.encounter={type:'enemy', mon};
      pushLog(mon.name+'が現れた！');
    }
    render(); return;
  }

  if(r<0.35){ pushLog('【深層'+S.run.depth+'】何も見つからなかった。'); S.run.encounter=null; }
  else if(r<0.55){ const it=genInstance(pickRandomDropKey(),S.run.depth); S.run.encounter={type:'item', item:it}; pushLog(dispName(it)+'が落ちている。'); }
  else if(r<0.70){ S.run.encounter={type:'trap'}; pushLog('宝箱を見つけた。罠があるかもしれない。'); }
  else if(r<0.90){ const mon=spawnMonster(S.run.depth); S.run.encounter={type:'enemy', mon}; pushLog(mon.name+'が現れた！'); }
  else { S.run.encounter={type:'stairs'}; pushLog('階段を見つけた。更に深く進めそうだ。'); }
  render();
}
function pickRandomDropKey(){
  if(Math.random()<0.12){ const seeds=['hpSeed','enSeed','skillSeed']; return seeds[Math.floor(Math.random()*seeds.length)]; }
  const pool=['club','dagger','sword','robe','exo','healPotion','capsule','idScroll','curseFix','energyPotion'];
  return pool[Math.floor(Math.random()*pool.length)];
}
function spawnMonster(depth){
  const cands=MONSTERS.filter(m=>depth>=m.min&&depth<=m.max);
  const base=cands[Math.floor(Math.random()*cands.length)]||MONSTERS[0];
  return {
    name:base.name,
    hp:base.hp+depth*2, maxHp:base.hp+depth*2,
    atk:base.atk+Math.floor(depth/2),
    def:base.def||0,
    undead:base.undead, goldMin:base.gold[0], goldMax:base.gold[1]
  };
}
function renderEncounter(){
  const e=S.run.encounter;
  if(e.type==='item'){
    return `<button class="primary" onclick="takeItem()">拾う（${dispName(e.item)}）</button>
      <button class="ghost" onclick="leaveEncounter()">放っておく</button>`;
  }
  if(e.type==='trap'){
    return `<button class="primary" onclick="openChest()">開ける(技:${S.skill})</button>
      <button class="ghost" onclick="leaveEncounter()">触らない</button>`;
  }
  if(e.type==='enemy'){
    return `<button class="danger" onclick="enterCombat()">戦闘開始</button>
      <button class="ghost" onclick="fleeBeforeCombat()">戦わずに離れる</button>`;
  }
  if(e.type==='stairs' && S.run.depth < MAX_DEPTH){
    const cost=S.run.depth+1;
    return `<button class="primary" onclick="descend(${cost})">降りる <span class="tag">エネルギー${cost}</span></button>
      <button class="ghost" onclick="leaveEncounter()">このまま探索を続ける</button>`;
  }
  return '';
}
function leaveEncounter(){ S.run.encounter=null; pushLog('【ダンジョン 深層'+S.run.depth+'】探索を続ける。'); render(); }
function takeItem(){
  if(S.backpack.length>=S.backpackLimit){
    toast('バックパックが満杯です。持ち物を整理してください。');
    return;
  }
  const it = S.run.encounter.item;
  S.backpack.push(it);
  pushLog(dispName(it)+' を手に入れた。');
  S.run.encounter=null;
  render();
}
function openChest(){
  const chance=Math.max(0.1,Math.min(0.9, 0.5+S.skill*0.04-S.run.depth*0.03));
  if(Math.random()<chance){
    const it=genInstance(pickRandomDropKey(),S.run.depth);
    if(S.backpack.length<S.backpackLimit){
      S.backpack.push(it);
      pushLog('解除成功。'+dispName(it)+' を手に入れた。');
      S.run.encounter=null;
    } else {
      S.run.encounter={type:'item', item:it, fromChest:true};
      pushLog('解除成功！ '+dispName(it)+' を見つけたがバックパックが満杯だ。');
    }
  } else {
    const k = Math.random()<0.5 ? 'hp' : 'energy';
    if(k==='hp'){
      const d=Math.max(0,Math.min(S.hp-1, 3+S.run.depth*2)); S.hp-=d;
      pushLog('罠にかかった！ HPが'+d+'減った。');
    } else {
      const d=Math.max(0,Math.min(S.energy-1, 2+Math.floor(S.run.depth/2))); S.energy-=d;
      pushLog('罠にかかった！ エネルギーが'+d+'減った。');
    }
    S.run.encounter=null;
  }
  render();
}
function descend(cost){
  if(S.run.depth >= MAX_DEPTH){ toast('ここが最深部だ。これ以上は降りられない。'); S.run.encounter=null; render(); return; }
  if(S.energy<cost){ toast('エネルギーが足りません'); return; }
  S.energy-=cost; S.run.depth+=1; S.run.turns=0;
  S.maxDepthReached=Math.max(S.maxDepthReached, S.run.depth);
  const msg = (S.run.depth===MAX_DEPTH)
    ? `【最深部 深層${S.run.depth}】へ降りた。ここがダンジョンの最奥だ！`
    : `【ダンジョン 深層${S.run.depth}】へ降りた。`;
  pushLog(msg);
  S.run.encounter=null; render();
}
function fleeBeforeCombat(){ pushLog('戦わずにその場を離れた。'); S.run.encounter=null; render(); }
function doReturn(){
  const cost=returnCost();
  if(S.energy<cost){ toast('エネルギーが足りません(帰還には'+cost+'必要)'); return; }
  S.energy-=cost;
  S.maxDepthReached=Math.max(S.maxDepthReached,S.run.depth);
  S.run=null;
  gotoScreen('town','【町】ダンジョンから無事に帰還した。');
}
function collapse(){
  const lost = Math.ceil(S.gold/2);
  S.gold -= lost;
  S.hp=S.maxHp; S.energy=S.maxEnergy;
  if(S.run) S.maxDepthReached=Math.max(S.maxDepthReached, S.run.depth);
  S.combat=null;
  S.run=null; S.screen='town';
  toastMsg='【町】回収業者に連れ戻された。所持金が半分になった(-'+lost+'G)。';
  render();
}

// ===================== 戦闘 =====================
function enterCombat(){
  S.combat={mon:S.run.encounter.mon, fled:false};
  S.run.encounter=null; S.screen='combat';
  pushLog('【戦闘】'+S.combat.mon.name+'との戦闘！');
  render();
}
function weaponPower(){
  const w=S.equipment.weapon;
  if(!w||w.junk||w.key==='junk') return 0;
  return ITEMS[w.key].power * w.level;
}
function armorPower(){
  const a=S.equipment.armor;
  if(!a||a.junk||a.key==='junk') return 0;
  return Math.round(ITEMS[a.key].power*(1+((a.level||1)-1)*0.5));
}
function atkTotal(){ return S.atk + weaponPower(); }
function defTotal(){ return S.def + armorPower(); }
function renderCombat(){
  const m=S.combat.mon;
  return `<div class="panel" id="enemyBox">
    <div class="row"><span>${m.name}</span><span>HP ${m.hp}/${m.maxHp}${m.undead?' <span class="tag">アンデッド</span>':''}${m.isBoss?' <span class="tag">BOSS</span>':''}</span></div>
    <div class="statbar"><div class="hpfill" style="width:${Math.max(0,Math.round(m.hp/m.maxHp*100))}%"></div></div>
  </div>${hudBlock()}
  <div class="panel">
    <button class="danger" onclick="combatAttack()">攻撃</button>
    <button onclick="openItems('combat')">アイテム</button>
    <button class="ghost" onclick="combatFlee()">逃げる</button>
  </div>`;
}
let busy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function shake(id){
  const el=document.getElementById(id); if(!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function pushLogSafe(msg){ if(S.run) pushLog(msg); }

function handleMonsterDefeat(m){
  const gold = m.goldMin + Math.floor(Math.random()*(m.goldMax-m.goldMin+1));
  S.gold += gold;
  if(m.isBoss){
    if(S.run) S.run.bossDefeated = true;
    S.gameCleared = true;
    pushLogSafe(`【完全制覇】${m.name}を撃破した！ +${gold}G`);
  } else {
    pushLogSafe(`${m.name}を倒した！ +${gold}G`);
  }
  S.combat = null;
  S.screen = 'dungeon';
  render();
}

async function enemyAct(){
  const m=S.combat.mon;
  if(m.hp<=0) return true;
  const dmg=Math.max(1, m.atk - defTotal());
  S.hp=Math.max(0,S.hp-dmg);
  pushLogSafe(m.name+'から'+dmg+'ダメージを受けた。');
  const ar=S.equipment.armor;
  if(ar && !ar.junk && ar.key!=='junk'){
    const nm=dispName(ar);
    ar.durability=Math.max(0,ar.durability-1);
    if(ar.durability===0){
      convertToJunk(ar);
      S.equipment.armor = null;
      if(S.backpack.length < S.backpackLimit) S.backpack.push(ar);
      pushLogSafe(nm+'が壊れて「ガラクタ」になった！');
    }
  }
  render(); shake('playerBox'); await sleep(600);
  if(S.hp<=0){ pushLogSafe('やられた…'); S.screen='dungeon'; collapse(); return false; }
  return true;
}
async function combatAttack(){
  if(busy||!S.combat) return; busy=true;
  try{
    const m=S.combat.mon;
    const rawDmg = atkTotal() - (m.def || 0) - Math.floor(Math.random()*3);
    const dmg = Math.max(1, rawDmg);
    m.hp-=dmg;
    const w=S.equipment.weapon;
    pushLogSafe(m.name+'に'+dmg+'ダメージ。');
    if(w && !w.junk && w.key!=='junk'){
      const nm=dispName(w);
      w.durability=Math.max(0,w.durability-1);
      if(w.durability===0){
        convertToJunk(w);
        S.equipment.weapon = null;
        if(S.backpack.length < S.backpackLimit) S.backpack.push(w);
        pushLogSafe(nm+'が壊れて「ガラクタ」になった！');
      }
    }
    render(); shake('enemyBox'); await sleep(600);
    if(m.hp<=0){
      handleMonsterDefeat(m);
      return;
    }
    if(await enemyAct()) render();
  } finally { busy=false; }
}
async function combatFlee(){
  if(busy||!S.combat) return; busy=true;
  try{
    const fleeChance = S.combat.mon.isBoss ? 0.35 : 0.7;
    if(Math.random()<fleeChance){ pushLogSafe('うまく逃げ切った。'); S.combat=null; S.screen='dungeon'; render(); return; }
    toast('逃げられなかった！');
    await sleep(400);
    if(await enemyAct()) render();
  } finally { busy=false; }
}

// ===================== アイテム画面(町・ダンジョン・戦闘共通) =====================
function openItems(ctx){
  if(busy) return;
  S.itemCtx=ctx; S.itemSel=null; S.itemMode=null; S.screen='items';
  if(S.run) pushLog('【持ち物】バックパックを確認する。');
  else toastMsg='【持ち物】バックパックを確認する。';
  render();
}
function closeItems(){
  S.itemSel=null; S.itemMode=null;
  const next = S.itemCtx||'town';
  if(next==='town') gotoScreen('town','【町】に戻った。');
  else if(next==='dungeon'){
    S.screen='dungeon';
    if(S.run && S.run.encounter && S.run.encounter.type==='item'){
      pushLog('【ダンジョン 深層'+S.run.depth+'】足元に '+dispName(S.run.encounter.item)+' が落ちている。');
    } else {
      pushLog('【ダンジョン 深層'+S.run.depth+'】探索画面に戻った。');
    }
    render();
  }
  else { S.screen=next; render(); }
}
function selectItem(u){ S.itemSel=(S.itemSel===u)?null:u; render(); }
function note(msg){ toast(msg); }
function isEquipped(it){
  const w=S.equipment.weapon, a=S.equipment.armor;
  return (w&&w.uid===it.uid)||(a&&a.uid===it.uid);
}
function unequipItem(u){
  const w=S.equipment.weapon, a=S.equipment.armor;
  if(w&&w.uid===u) unequip('weapon'); else if(a&&a.uid===u) unequip('armor');
}
function discardItem(u){
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0) return;
  const it=S.backpack[idx];
  const nm=dispName(it);
  S.backpack.splice(idx,1);
  S.itemSel=null;
  note(nm+'を捨てた。');
}
function actionPanel(it){
  const isJunkItem = (it.junk || it.key==='junk');
  const t=ITEMS[it.key].type, eq=isEquipped(it), inCombat=S.itemCtx==='combat';
  const canUse=!eq&&!isJunkItem&&(t==='potion'||t==='tool'||t==='seed');
  const canEquip=!isJunkItem&&(t==='weapon'||t==='armor');
  const canAppraise=!eq&&!it.identified&&!isJunkItem;
  const st='style="text-align:center;margin:0;padding:8px 2px;font-size:.84rem"';
  let cols = 4 + (inCombat ? 1 : 0);
  let btns=`<button ${st} ${canUse?'':'disabled'} onclick="useOnSelf(${it.uid})">使う</button>`;
  btns+=`<button ${st} ${canAppraise?'':'disabled'} onclick="appraiseItem(${it.uid})">鑑定</button>`;
  if(inCombat) btns+=`<button ${st} ${eq?'disabled':''} onclick="throwAtEnemy(${it.uid})">投げる</button>`;
  btns+=`<button ${st} ${canEquip||eq?'':'disabled'} onclick="${eq?`unequipItem(${it.uid})`:`equip(${it.uid})`}">${eq?'外す':'装備'}</button>`;
  btns+=`<button ${st} ${eq?'disabled':''} onclick="discardItem(${it.uid})">捨てる</button>`;
  return `<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:5px;margin:0 0 8px">${btns}</div>`;
}
function itemDetail(it){
  if(it.junk || it.key==='junk') return '';
  const t=ITEMS[it.key].type;
  if((t==='weapon'||t==='armor') && it.identified) return ` <span class="tag">耐久${it.durability}/${it.maxDurability}</span>`;
  return '';
}
function targetOk(it){
  if(it.junk || it.key==='junk') return false;
  const m=S.itemMode; if(!m) return true;
  if(it.uid===m.src) return false;
  if(m.kind==='identify') return !it.identified || (it.cursed && !it.cursedRevealed);
  if(m.kind==='removeCurse'){ const t=ITEMS[it.key].type; return t==='weapon'||t==='armor'; }
  return false;
}
function cancelTool(){ S.itemMode=null; render(); }
function applyTool(tu){
  const m=S.itemMode; if(!m) return;
  const idx=S.backpack.findIndex(i=>i.uid===m.src);
  if(idx<0){ S.itemMode=null; render(); return; }
  const t=findAnyItem(tu); if(!t||!targetOk(t)) return;
  if(m.kind==='identify'){
    identifyItem(t);
    note(dispName(t)+'だと判明した。'+(t.cursed?'呪われている！':''));
  } else {
    if(uncurseItem(t)) note(dispName(t)+'の呪いが解けた。');
    else note(dispName(t)+'は呪われていなかった。');
  }
  S.backpack.splice(idx,1); S.itemMode=null; itemDone();
}

// 技能値による自力鑑定コマンド（失敗すると完全に「ガラクタ」になる）
function appraiseItem(u){
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0) return;
  const it=S.backpack[idx];
  if(it.identified || it.junk || it.key==='junk') return;
  const chance = Math.max(0.25, Math.min(0.95, 0.35 + S.skill * 0.05));
  if(Math.random() < chance){
    identifyItem(it);
    note('鑑定成功！ '+dispName(it)+(it.cursed?'…呪われている！':'だと判明した。'));
  } else {
    convertToJunk(it);
    note('鑑定に失敗した…解析ミスで完全に「ガラクタ」になってしまった！');
  }
  itemDone();
}

function renderItems(){
  const w=S.equipment.weapon, a=S.equipment.armor, mode=S.itemMode;
  const row=(it,label)=>{
    const txt=`${label?'['+label+'] ':''}${dispName(it)}${itemDetail(it)}${it.locked?' <span class="tag">呪い中</span>':''}${durBar(it)}`;
    if(mode) return `<button ${targetOk(it)?'':'disabled'} onclick="applyTool(${it.uid})">${txt}</button>`;
    const sel=S.itemSel===it.uid;
    return `<button onclick="selectItem(${it.uid})" ${sel?'style="border-style:double;border-width:3px"':''}>${txt}</button>`+(sel?actionPanel(it):'');
  };
  const eqHtml=(w?row(w,'武器'):'<div class="sub">武器: なし</div>')+(a?row(a,'防具'):'<div class="sub">防具: なし</div>');
  const list=S.backpack.map(it=>row(it,'')).join('');
  const modeHtml=mode?`<div class="panel"><p>${mode.kind==='identify'?'鑑定する対象を選んでください。':'呪いを解く対象を選んでください。'}</p><button class="ghost" onclick="cancelTool()">キャンセル</button></div>`:'';
  let enemy='';
  if(S.itemCtx==='combat'&&S.combat){
    const m=S.combat.mon;
    enemy=`<div class="panel"><div class="row"><span>${m.name}</span><span>HP ${m.hp}/${m.maxHp}${m.undead?' <span class="tag">アンデッド</span>':''}</span></div></div>`;
  }
  return enemy+hudBlock()+modeHtml+`<div class="panel"><div class="sub">装備中</div>${eqHtml}</div>
   <div class="panel"><div class="sub">バックパック ${S.backpack.length}/${S.backpackLimit}</div>${list||'<p class="sub">何も持っていません</p>'}
   <button class="ghost" onclick="closeItems()">戻る</button></div>`;
}
function itemDone(){
  S.itemSel=null;
  if(S.itemCtx==='combat'&&S.combat) S.screen='combat';
  render();
}
function useOnSelf(u){
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0)return;
  const it=S.backpack[idx]; const b=ITEMS[it.key];
  if(it.junk || it.key==='junk'){ note('ガラクタは使えない。'); return; }
  if(b.type==='potion'){
    it.identified=true;
    if(it.effect==='heal'){ const heal=Math.min(S.maxHp-S.hp,15); S.hp+=heal; note(heal+'回復した。'); }
    else if(it.effect==='energy'){ const g=Math.min(S.maxEnergy-S.energy,10); S.energy+=g; note('エネルギーが'+g+'回復した。'); }
    else if(it.effect==='cureCurse'){
      const cw = (S.equipment.weapon && S.equipment.weapon.cursed) ? S.equipment.weapon : null;
      const ca = (S.equipment.armor && S.equipment.armor.cursed) ? S.equipment.armor : null;
      const target = cw || ca;
      if(target){ uncurseItem(target); note(dispName(target)+'の呪いが解けた。'); }
      else note('呪われている装備はない。');
    }
    S.backpack.splice(idx,1);
  } else if(b.type==='seed'){
    it.identified=true;
    const n=1+Math.floor(Math.random()*3);
    if(b.effect==='seedHp'){ S.maxHp+=n; S.hp+=n; note(b.name+'を使った！ 最大HPが'+n+'上がった。'); }
    else if(b.effect==='seedEn'){ S.maxEnergy+=n; S.energy+=n; note(b.name+'を使った！ 最大エネルギーが'+n+'上がった。'); }
    else { S.skill+=n; note(b.name+'を使った！ 技能が'+n+'上がった。'); }
    S.backpack.splice(idx,1);
  } else if(b.effect==='identify'||b.effect==='removeCurse'){
    it.identified=true;
    S.itemMode={kind:b.effect,src:u};
    if(![...S.backpack,S.equipment.weapon,S.equipment.armor].filter(Boolean).some(targetOk)){
      S.itemMode=null; note(b.effect==='identify'?'鑑定する対象がない。':'対象にできる装備がない。'); return;
    }
    S.itemSel=null; render(); return;
  } else { return; }
  itemDone();
}
async function throwAtEnemy(u){
  if(busy||!S.combat) return;
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0)return;
  const it=S.backpack[idx]; const b=ITEMS[it.key]; const m=S.combat.mon;
  const isJunkItem = (it.junk || it.key==='junk');
  it.identified=true; S.backpack.splice(idx,1);
  const nm=dispName(it);
  let hit=false;
  if(!isJunkItem && (b.type==='weapon'||b.type==='armor')){
    const dmg=Math.max(1, Math.round((b.power||2)*(it.level||1)*1.2) - Math.floor((m.def||0)*0.5));
    m.hp-=dmg; hit=true; pushLogSafe(nm+'を投げつけた！ '+dmg+'ダメージ。');
  } else if(!isJunkItem && b.type==='potion'){
    if(it.effect==='heal'){
      if(m.undead){ m.hp-=15; hit=true; pushLogSafe(nm+'を浴びせた！ アンデッドに15ダメージ。'); }
      else { const g=Math.min(m.maxHp-m.hp,15); m.hp+=g; pushLogSafe(nm+'を投げつけた…敵が'+g+'回復してしまった。'); }
    } else pushLogSafe(nm+'を投げつけたが、効果はなかった。');
  } else {
    pushLogSafe(nm+'を投げつけたが、効果はなかった。');
  }
  S.itemSel=null; S.screen='combat'; busy=true;
  try{
    render(); if(hit) shake('enemyBox');
    await sleep(hit?600:350);
    if(m.hp<=0){
      handleMonsterDefeat(m);
      return;
    }
    if(await enemyAct()) render();
  } finally { busy=false; }
}

function renderGameover(){ return hudBlock()+'<div class="panel">—</div>'; }

render();
</script>
</body>
</html>
