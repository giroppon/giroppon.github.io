<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外骨格ローグ(仮)</title>
<style>
:root{
  --bg:#000; --panel:#000; --text:#fff; --sub:#bdbdbd;
  --accent:#fff; --danger:#fff; --warn:#fff; --border:#fff; --r:6px;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,monospace;line-height:1.5}
#app{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:1.1rem;margin:0 0 4px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0}
.sub{color:var(--sub);font-size:.85rem}
button{
  display:block;width:100%;text-align:left;background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin:6px 0;
  font-family:inherit;font-size:.95rem;cursor:pointer;
}
button:active{background:#333}
button:disabled{opacity:.35;cursor:default}
button.primary{border-style:double;border-width:3px}
button.start{background:#fff;color:#000;border-color:#fff;font-weight:bold;text-align:center}
input[type=number]{background:#000;color:#fff;border:1px solid var(--border);border-radius:min(var(--r),8px);padding:4px 6px;font-family:inherit;width:64px}
input[type=range]{accent-color:#fff;width:100%}
button.danger{border-style:double;border-width:3px}
button.ghost{border:1px dashed var(--sub);color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statbar{height:10px;border:1px solid var(--border);background:#000;overflow:hidden;margin-top:2px;border-radius:min(var(--r),6px)}
.statbar>div{height:100%}
.hpfill{background:#fff}
.enfill{background:repeating-linear-gradient(90deg,#fff 0 4px,#000 4px 6px)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.menubtn{background:none;border:none;color:var(--text);font-size:1.4rem;cursor:pointer;width:auto;padding:4px 8px}
.log{max-height:160px;overflow-y:auto;font-size:.85rem;color:var(--sub);border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
.log div{margin:2px 0}
.center{text-align:center}
.startwrap{display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:70vh;position:relative}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:5}
.overlaybox{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px;width:min(320px,90vw)}
.tag{display:inline-block;border-radius:min(var(--r),8px);font-size:.75rem;padding:1px 6px;border:1px solid var(--border);color:var(--sub);margin-left:4px}
.msgwin{height:6.8rem;overflow-y:auto;font-size:.9rem;padding:8px 12px;line-height:1.45}
@keyframes shake{
  0%,100%{transform:translateX(0);filter:none}
  15%{transform:translateX(-9px);filter:invert(1)}
  30%{transform:translateX(9px);filter:invert(1)}
  45%{transform:translateX(-7px);filter:none}
  60%{transform:translateX(6px)}
  80%{transform:translateX(-3px)}
}
.shake{animation:shake .45s linear}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===================== データ =====================
const ITEMS = {
  club:{name:'棍棒',type:'weapon',power:3,price:10,maxDur:20},
  dagger:{name:'ダガー',type:'weapon',power:4,price:15,maxDur:15},
  sword:{name:'鋼の剣',type:'weapon',power:7,price:40,maxDur:25},
  robe:{name:'ローブ',type:'armor',power:2,price:12,maxDur:20},
  exo:{name:'外骨格',type:'armor',power:4,price:25,maxDur:30},
  healPotion:{name:'回復薬',type:'potion',price:15,fixed:true,effect:'heal'},
  capsule:{name:'薬',type:'potion',price:15,effect:'random'},
  idScroll:{name:'鑑定スキャナー',type:'tool',price:20,effect:'identify'},
  curseFix:{name:'デバッグツール',type:'tool',price:50,effect:'removeCurse'},
  energyPotion:{name:'エネルギー回復薬',type:'potion',price:20,fixed:true,effect:'energy'},
  hpSeed:{name:'HPの種',type:'seed',price:40,fixed:true,effect:'seedHp'},
  enSeed:{name:'エネルギーの種',type:'seed',price:40,fixed:true,effect:'seedEn'},
  skillSeed:{name:'技能の種',type:'seed',price:40,fixed:true,effect:'seedSkill'},
};
const DEFAULT_SHOP = ['club','robe','healPotion'];
const MONSTERS=[
 {name:'錆びたドローン',hp:10,atk:3,gold:[4,10],undead:false,min:1,max:4},
 {name:'徘徊ワーム',hp:15,atk:4,gold:[6,14],undead:false,min:1,max:5},
 {name:'腐食ゾンビ外骨格',hp:18,atk:4,gold:[8,16],undead:true,min:2,max:7},
 {name:'バグ化メカ',hp:24,atk:6,gold:[12,24],undead:false,min:3,max:9},
 {name:'深層ガーディアン',hp:38,atk:9,gold:[20,40],undead:false,min:5,max:12},
];

// ===================== 状態 =====================
let uidSeed = 1;
function uid(){ return uidSeed++; }
let S = loadState();
if(S){ uidSeed = S.uid || uidSeed; } else { S = freshState(); }
let toastMsg='';
let msgFresh=false;
document.addEventListener('click',e=>{ if(e.target.closest && e.target.closest('button')) msgFresh=true; },true);
function toast(msg){
  if(S.run){ pushLog(msg); render(); return; } // ダンジョン内はログとして残る
  toastMsg=msg; render();
  setTimeout(()=>{ if(toastMsg===msg){ toastMsg=''; render(); } }, 3500);
}

function freshState(){
  return {
    uid:1,
    hp:30,maxHp:30,energy:20,maxEnergy:20,atk:5,def:2,skill:5,
    gold:80,debt:0,maxDepthReached:1,
    backpack:[genInstance('club',1,true),genInstance('robe',1,true),genInstance('healPotion',1,true)],
    backpackLimit:10,
    equipment:{weapon:null,armor:null},
    shop:{},
    screen:'start', menuOpen:false, radius:6,
    run:null, // {depth,turns,encounter,log:[]}
  };
}
function saveState(){ S.uid=uidSeed; localStorage.setItem('exo_rogue_save', JSON.stringify(S)); }
function loadState(){ try{ const raw=localStorage.getItem('exo_rogue_save'); return raw?JSON.parse(raw):null; }catch(e){ return null; } }

// ===================== アイテム生成 =====================
function genInstance(key, depth, guaranteedSafe){
  const base = ITEMS[key];
  const it = {uid:uid(), key};
  if(base.type==='weapon'||base.type==='armor'){
    it.level = Math.max(1, Math.round(depth*(0.6+Math.random()*0.8)));
    it.maxDurability = Math.round(base.maxDur*(1+(it.level-1)*0.3));
    it.durability = it.maxDurability;
    it.junk=false;
    it.cursed = guaranteedSafe ? false : Math.random()<0.15;
    it.cursedRevealed=false; it.locked=false;
  }
  if(base.fixed){ it.identified=true; }
  else { it.identified = guaranteedSafe ? true : Math.random()<0.2; }
  if(it.cursed){ it.identified=false; it.cursedRevealed=false; } // 呪い品は必ず不確定名
  if(base.type==='potion' && base.effect==='random'){
    const r=Math.random(); it.effect = r<0.4?'heal':(r<0.7?'cureCurse':'curse');
  } else if(base.effect && base.effect!=='random'){ it.effect = base.effect; }
  return it;
}
function setLevel(it,L){ const b=ITEMS[it.key]; it.level=L; it.maxDurability=Math.round(b.maxDur*(1+(L-1)*0.3)); it.durability=it.maxDurability; }
function identifyItem(it){ it.identified=true; if(it.cursed) it.cursedRevealed=true; }
function uncurseItem(it){
  if(!it.cursed) return false;
  if(it.locked){ it.locked=false; if(ITEMS[it.key].type==='weapon') S.atk+=2; else S.def+=1; }
  it.cursed=false; it.cursedRevealed=false; return true;
}
function durBar(it){
  const t=ITEMS[it.key].type; if(t!=='weapon'&&t!=='armor') return '';
  const r=Math.max(0,Math.min(100,Math.round(it.durability/it.maxDurability*100)));
  return `<div class="statbar" style="margin-top:4px"><div class="hpfill" style="width:${r}%"></div></div>`;
}
function dispName(it){
  const b=ITEMS[it.key];
  let base=b.name;
  if(it.key==='capsule' && it.identified) base=({heal:'回復薬',cureCurse:'解呪薬',curse:'呪いの薬'})[it.effect]||b.name;
  let n = it.identified ? base : ('謎の'+b.name);
  if((b.type==='weapon'||b.type==='armor') && it.identified) n+=' Lv'+it.level;
  if(it.junk) n+='(ガラクタ)';
  if(it.cursedRevealed) n+='(呪)';
  return n;
}
function refPrice(it){
  const b=ITEMS[it.key];
  if(b.type==='weapon'||b.type==='armor'){
    return priceFor(it.key, it.level||1);
  }
  return b.price;
}
function priceFor(key,level){ return Math.round(ITEMS[key].price*(1+(level-1)*0.5)); }

// ===================== 画面描画 =====================
const app=document.getElementById('app');
function render(){
  applyRadius();
  if(S.screen==='equip') S.screen='town';
  let html='';
  if(S.screen==='start') html=renderStart();
  else if(S.screen==='town') html=renderTown();
  else if(S.screen==='church') html=renderChurch();
  else if(S.screen==='lounge') html=renderLounge();
  else if(S.screen==='shopMenu') html=renderShopMenu();
  else if(S.screen==='shopBuy') html=renderShopBuy();
  else if(S.screen==='shopSell') html=renderShopSell();
  else if(S.screen==='shopIdentify') html=renderShopIdentify();
  else if(S.screen==='shopRepair') html=renderShopRepair();
  else if(S.screen==='inn') html=renderInn();
  else if(S.screen==='dungeonSetup') html=renderDungeonSetup();
  else if(S.screen==='dungeon') html=renderDungeon();
  else if(S.screen==='combat') html=renderCombat();
  else if(S.screen==='items') html=renderItems();
  else if(S.screen==='gameover') html=renderGameover();
  app.innerHTML = html + ((S.menuOpen && S.screen==='start') ? renderMenuOverlay() : '');
  try{ saveState(); }catch(e){}
}
function topbar(title){
  return `<div class="topbar"><h1>${title}</h1></div>`;
}
function renderMenuOverlay(){
  return `<div class="overlay" onclick="toggleMenu()">
    <div class="overlaybox" onclick="event.stopPropagation()">
      <div class="row"><span>角丸(px)</span><input id="radNum" type="number" min="0" max="40" value="${S.radius==null?6:S.radius}" oninput="setRadius(this.value,'radRange')"></div>
      <input id="radRange" type="range" min="0" max="40" value="${S.radius==null?6:S.radius}" oninput="setRadius(this.value,'radNum')" style="margin:6px 0 14px">
      <button class="danger" onclick="resetGame()">記録を消す</button>
      <button class="ghost" onclick="toggleMenu()">閉じる</button>
    </div></div>`;
}
function applyRadius(){ document.documentElement.style.setProperty('--r',(S.radius==null?6:S.radius)+'px'); }
function setRadius(v,otherId){
  v=Math.max(0,Math.min(40,Math.round(Number(v)||0)));
  S.radius=v; applyRadius();
  const o=document.getElementById(otherId); if(o) o.value=v;
  try{ saveState(); }catch(e){}
}
function toggleMenu(){ S.menuOpen=!S.menuOpen; render(); }
function resetGame(){ localStorage.removeItem('exo_rogue_save'); S=freshState(); uidSeed=1; render(); }

function renderStart(){
  return `<div class="startwrap">
    <h1 style="font-size:1.6rem">外骨格ローグ(仮)</h1>
    <p class="sub">金こそがすべて。深層で稼ぎ、街で拡張せよ。</p>
    <button class="start" style="max-width:220px" onclick="S.screen='town';render()">ゲームを始める</button>
  </div><button class="menubtn" style="position:fixed;top:10px;right:10px" onclick="toggleMenu()">≡</button>`;
}

function msgWindow(){
  let lines=[];
  if(S.run) lines=S.run.log.slice(-4);
  else if(toastMsg) lines=[toastMsg];
  return `<div class="panel msgwin" id="msgBox">${lines.map((l,i)=>`<div${i<lines.length-1?' class="sub"':''}>${l}</div>`).join('')}</div>`;
}
function statBlock(){
  const hpP=Math.max(0,Math.round(S.hp/S.maxHp*100));
  const enP=Math.max(0,Math.round(S.energy/S.maxEnergy*100));
  return `<div class="panel" id="playerBox">
    <div class="row"><span>HP ${S.hp}/${S.maxHp}${S.statusCursed?' (呪)':''}</span><span>所持金 ${S.gold}G${S.debt>0?` <span class="tag">借金${S.debt}G</span>`:''}</span></div>
    <div class="statbar"><div class="hpfill" style="width:${hpP}%"></div></div>
    <div class="row" style="margin-top:6px"><span>エネルギー ${S.energy}/${S.maxEnergy}</span></div>
    <div class="statbar"><div class="enfill" style="width:${enP}%"></div></div>
    <div class="row" style="margin-top:6px"><span>ATK ${atkTotal()} <span class="sub">(素${S.atk}+装備${weaponPower()})</span></span><span>DEF ${defTotal()} <span class="sub">(素${S.def}+装備${armorPower()})</span></span></div>
    <div class="row"><span>技能 ${S.skill} <span class="sub">(宝箱の解除)</span></span></div>
  </div>${msgWindow()}`;
}

function renderTown(){
  return topbar('町')+statBlock()+
    `<div class="panel">
      <button onclick="S.screen='shopMenu';render()">商店</button>
      <button onclick="S.screen='inn';render()">宿(HP・エネルギー回復)</button>
      <button onclick="openItems('town')">持ち物</button>
      <button onclick="S.screen='church';render()">教会(解呪)</button>
      <button class="primary" onclick="S.screen='dungeonSetup';render()">ダンジョンへ</button>
      <button class="ghost" onclick="S.screen='start';render()">スタート画面に戻る</button>
    </div>`;
}
// ---- 教会 ----
function churchCost(){ return 30; }
function cursedList(){
  return [S.equipment.weapon,S.equipment.armor,...S.backpack].filter(it=>it&&it.cursed&&(it.cursedRevealed||it.locked));
}
function renderChurch(){
  const cost=churchCost();
  const rows=cursedList().map(it=>`<button onclick="churchUncurse(${it.uid})">${dispName(it)}${isEquipped(it)?' <span class="tag">装備中</span>':''} <span class="tag">${cost}G</span></button>`).join('');
  const self=S.statusCursed?`<button onclick="churchUncurseSelf()">本人の呪い <span class="tag">${cost}G</span></button>`:'';
  return topbar('教会')+statBlock()+`<div class="panel"><p class="sub">呪いを解いてもらえます。</p>${rows}${self}${(!rows&&!self)?'<p class="sub">解呪が必要なものはありません</p>':''}
    <button class="ghost" onclick="S.screen='town';render()">戻る</button></div>`;
}
function churchUncurse(u){
  const it=findAnyItem(u); if(!it) return;
  const cost=churchCost();
  if(S.gold<cost){ toast('所持金が足りません('+cost+'G必要)'); return; }
  S.gold-=cost; uncurseItem(it);
  toast(dispName(it)+'の呪いが解けた。');
}
function churchUncurseSelf(){
  const cost=churchCost();
  if(S.gold<cost){ toast('所持金が足りません('+cost+'G必要)'); return; }
  S.gold-=cost; S.statusCursed=false; S.atk+=2; S.def+=1;
  toast('呪いが解けた。');
}

// ---- 商店メニュー ----
function renderShopMenu(){
  return topbar('商店')+statBlock()+`<div class="panel">
    <button onclick="S.screen='shopBuy';render()">買う</button>
    <button onclick="S.screen='shopSell';render()">売る</button>
    <button onclick="S.screen='shopIdentify';render()">鑑定</button>
    <button onclick="S.screen='shopRepair';render()">修理</button>
    <button class="ghost" onclick="S.screen='town';render()">店を出る</button></div>`;
}

// ---- 買う ----
function isInfinite(k){ const t=ITEMS[k].type; return DEFAULT_SHOP.includes(k) && t!=='weapon' && t!=='armor'; }
function renderShopBuy(){
  const keys = Array.from(new Set([...DEFAULT_SHOP, ...Object.keys(S.shop)])).filter(k=>ITEMS[k]);
  let rows = keys.map(k=>{
    const b=ITEMS[k], cat=S.shop[k], inf=isInfinite(k);
    if(!inf && !cat) return '';
    const stock = inf ? '∞' : cat.stock;
    const isEq = (b.type==='weapon'||b.type==='armor');
    const lv = isEq && cat ? (cat.level||1) : 1;
    const price = priceFor(k,lv);
    const label = isEq ? `${b.name} Lv${lv}` : b.name;
    return `<button ${stock===0?'disabled':''} onclick="buyItem('${k}')">${label} <span class="tag">${price}G</span> <span class="tag">在庫${stock}</span></button>`;
  }).join('');
  return topbar('商店 - 買う')+statBlock()+`<div class="panel">${rows||'<p class="sub">商品がありません</p>'}
    <button class="ghost" onclick="S.screen='shopMenu';render()">戻る</button></div>`;
}
function buyItem(key){
  const cat=S.shop[key], inf=isInfinite(key);
  if(!inf && (!cat||cat.stock<=0)){ toast('在庫切れです'); return; }
  const isEq=(ITEMS[key].type==='weapon'||ITEMS[key].type==='armor');
  const lv = isEq && cat ? (cat.level||1) : 1;
  const price=priceFor(key,lv);
  if(S.gold<price){ toast('所持金が足りません'); return; }
  if(S.backpack.length>=S.backpackLimit){ toast('バックパックが満杯です'); return; }
  S.gold-=price; if(!inf) cat.stock-=1;
  const ni=genInstance(key, 1, true); // 店売り品は常に安全・鑑定済み
  if(isEq) setLevel(ni,lv); // 売られた最高レベルで固定
  S.backpack.push(ni);
  render();
}

// ---- 売る ----
function renderShopSell(){
  if(S.backpack.length===0) return topbar('商店 - 売る')+statBlock()+`<div class="panel"><p class="sub">売るものがありません</p><button class="ghost" onclick="S.screen='shopMenu';render()">戻る</button></div>`;
  const rows = S.backpack.map(it=>{
    const p = sellPrice(it);
    return `<button onclick="sellItem(${it.uid})">${dispName(it)} <span class="tag">${p}G</span></button>`;
  }).join('');
  return topbar('商店 - 売る')+statBlock()+`<div class="panel">${rows}<button class="ghost" onclick="S.screen='shopMenu';render()">戻る</button></div>`;
}
function sellPrice(it){
  if(!it.identified) return 1; // 未鑑定は一律1G
  const b=ITEMS[it.key];
  if(it.junk) return 10;
  if(b.type!=='weapon'&&b.type!=='armor') return Math.max(1,Math.round(b.price*0.5));
  let p=Math.round(refPrice(it)*0.5);
  const ratio = it.durability/it.maxDurability;
  p = Math.round(p*(0.5+ratio*0.5));
  return Math.max(1,p);
}
function sellItem(u){
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0)return;
  const it=S.backpack[idx]; const price=sellPrice(it);
  S.gold+=price; S.backpack.splice(idx,1);
  const cat=S.shop[it.key]||{level:1,stock:0};
  const isEq=(ITEMS[it.key].type==='weapon'||ITEMS[it.key].type==='armor');
  cat.level = isEq ? Math.max(cat.level||1, it.level||1) : 1; // 武器防具は売られた最高レベルで固定(未鑑定でも)
  cat.stock+=1; // 売ったものは種類を問わず店に並ぶ
  S.shop[it.key]=cat;
  render();
}
function identifyCost(it){ return Math.max(1, Math.round(refPrice(it)*0.5)); }

// ---- 鑑定 ----
function renderShopIdentify(){
  const targets = S.backpack.filter(i=>!i.identified);
  if(targets.length===0) return topbar('商店 - 鑑定')+statBlock()+`<div class="panel"><p class="sub">未鑑定のアイテムがありません</p><button class="ghost" onclick="S.screen='shopMenu';render()">戻る</button></div>`;
  const rows = targets.map(it=>{
    const cost = identifyCost(it);
    return `<button onclick="shopIdentify(${it.uid})">${dispName(it)} <span class="tag">${cost}G</span></button>`;
  }).join('');
  return topbar('商店 - 鑑定')+statBlock()+`<div class="panel">${rows}<button class="ghost" onclick="S.screen='shopMenu';render()">戻る</button></div>`;
}
function shopIdentify(u){
  const it=S.backpack.find(i=>i.uid===u); if(!it)return;
  const cost=identifyCost(it);
  if(S.gold<cost){toast('所持金が足りません');return;}
  S.gold-=cost; identifyItem(it);
  if(it.cursed) toast(dispName(it)+'…呪われている！'); else render();
}

// ---- 修理 ----
function renderShopRepair(){
  const targets = S.backpack.filter(i=>(ITEMS[i.key].type==='weapon'||ITEMS[i.key].type==='armor') && i.durability<i.maxDurability);
  const eq = [S.equipment.weapon,S.equipment.armor].filter(i=>i && i.durability<i.maxDurability);
  const all=[...targets,...eq];
  if(all.length===0) return topbar('商店 - 修理')+statBlock()+`<div class="panel"><p class="sub">修理が必要な装備がありません</p><button class="ghost" onclick="S.screen='shopMenu';render()">戻る</button></div>`;
  const rows = all.map(it=>{
    const cost = repairCost(it);
    return `<button onclick="repairItem(${it.uid})">${dispName(it)} 耐久${it.durability}/${it.maxDurability} <span class="tag">${cost}G</span>${durBar(it)}</button>`;
  }).join('');
  return topbar('商店 - 修理')+statBlock()+`<div class="panel">${rows}<button class="ghost" onclick="S.screen='shopMenu';render()">戻る</button></div>`;
}
function repairCost(it){
  const ratio=Math.max(0,Math.min(1,it.durability/it.maxDurability));
  return Math.max(1, Math.round(refPrice(it)*0.5*(1-ratio)));
}
function findAnyItem(u){
  let it=S.backpack.find(i=>i.uid===u); if(it)return it;
  if(S.equipment.weapon&&S.equipment.weapon.uid===u) return S.equipment.weapon;
  if(S.equipment.armor&&S.equipment.armor.uid===u) return S.equipment.armor;
  return null;
}
function repairItem(u){
  const it=findAnyItem(u); if(!it)return;
  const cost=repairCost(it);
  if(S.gold<cost){toast('所持金が足りません');return;}
  S.gold-=cost; it.durability=it.maxDurability; it.junk=false; render();
}

// ---- 宿 ----
function renderInn(){
  const cost = 10 + S.maxDepthReached*3;
  return topbar('宿')+statBlock()+`<div class="panel">
    <button class="primary" onclick="rest(${cost})">休む(HP・エネルギー全回復) <span class="tag">${cost}G</span></button>
    <button onclick="stable()">馬小屋(エネルギーのみ回復) <span class="tag">無料</span></button>

    <button class="ghost" onclick="S.screen='town';render()">戻る</button></div>`;

function rest(cost){

}
function stable(){
  if(S.energy>=S.maxEnergy){ toast('エネルギーは満タンです。'); return; }
  S.energy=S.maxEnergy;
  toast('馬小屋の藁の上で休んだ。エネルギーが全回復した。');
}

let lastTalk=-1;
function enterLounge(){ toastMsg=''; S.screen='lounge'; render(); }
function leaveLounge(){ toastMsg=''; S.screen='inn'; render(); }
function talk(){

  lastTalk=i; toastMsg=TALKS[i]; render();
}
function renderLounge(){
  return topbar('ラウンジ')+statBlock()+`<div class="panel">
    <p class="sub">宿のラウンジ。常連たちが思い思いに話している。</p>
    <button class="primary" onclick="talk()">話を聞く</button>

// ---- 装備 ----
function equip(u){
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0)return;
  const it=S.backpack[idx]; const slot=ITEMS[it.key].type;
  const prev=S.equipment[slot];
  if(prev&&prev.locked){ toast('いま装備している物が呪いで外せません'); return; }
  S.backpack.splice(idx,1);
  if(prev) S.backpack.push(prev);
  S.equipment[slot]=it;
  if(it.cursed && !it.locked){
    it.identified=true; it.cursedRevealed=true; it.locked=true;
    if(slot==='weapon') S.atk-=2; else S.def-=1;
    toast('呪われていた！ '+dispName(it)+' が外せなくなった('+(slot==='weapon'?'ATK -2':'DEF -1')+')');
  }
  afterEquipChange();
}
function afterEquipChange(){
  if(S.screen==='items'){ S.itemSel=null; if(S.itemCtx==='combat'&&S.combat) S.screen='combat'; }
  render();
}
function unequip(slot){
  const it=S.equipment[slot]; if(!it)return;
  if(it.locked){ toast('呪いで外せません'); return; }
  if(S.backpack.length>=S.backpackLimit){ toast('バックパックが満杯です'); return; }
  S.equipment[slot]=null; S.backpack.push(it); afterEquipChange();
}

// ===================== ダンジョン =====================
function renderDungeonSetup(){
  const maxD=Math.min(S.maxDepthReached, 12);
  let opts='';
  for(let d=1; d<=maxD; d++) opts+=`<button ${S.energy>d?'':'disabled'} onclick="startDungeon(${d})">深層${d}から潜る <span class="tag">エネルギー${d}</span></button>`;
  return topbar('ダンジョン')+statBlock()+`<div class="panel">
    <p class="sub">エネルギーが尽きる、または戦闘に負けると、その場で倒れて回収業者に運ばれます(所持金が半分になり、HP・エネルギーは全回復します)。</p>
    <p class="sub">エネルギー ${S.energy}/${S.maxEnergy}。潜る階層と同じ量のエネルギーを消費します。</p>
    ${opts}
    <button class="ghost" onclick="S.screen='town';render()">戻る</button></div>`;
}
function startDungeon(depth){
  if(S.energy<=depth){ toast('エネルギーが足りません'); return; }
  S.energy-=depth;
  S.run={depth, turns:0, encounter:null, log:['深層'+depth+'に突入した。']};
  S.screen='dungeon'; render();
}
function pushLog(msg){
  if(msgFresh){ S.run.log=[]; msgFresh=false; } // 操作ごとにメッセージを書き直す
  S.run.log.push(msg); if(S.run.log.length>6) S.run.log.shift();
}

function renderDungeon(){
  const r=S.run;
  let enc='';
  if(r.encounter) enc = renderEncounter();
  else enc = `<button class="primary" onclick="doSearch()">周囲を探す <span class="tag">エネルギー1</span></button>
    <button onclick="doReturn()">帰還する <span class="tag">エネルギー${returnCost()}</span></button>`;
  return topbar('ダンジョン 深層'+r.depth)+statBlock()+
    `<div class="panel"><div class="row"><span>探索回数 ${r.turns}</span><span>帰還コスト ${returnCost()}</span></div></div>
     <div class="panel">${enc}<button class="ghost" onclick="openItems('dungeon')">持ち物</button></div>`;
}
function itemDetail(it){
  const t=ITEMS[it.key].type;
  if((t==='weapon'||t==='armor') && it.identified) return ` <span class="tag">耐久${it.durability}/${it.maxDurability}</span>`;
  return '';
}
function returnCost(){ return S.run.depth + Math.floor(S.run.turns/5); }

function doSearch(){
  const cost=1;
  S.energy-=cost; S.run.turns++;
  if(S.energy<=0){ pushLog('エネルギーが尽きて倒れた…'); collapse(); return; }
  const r=Math.random();
  if(r<0.35){ pushLog('何も見つからなかった。'); S.run.encounter=null; }
  else if(r<0.55){ const it=genInstance(pickRandomDropKey(),S.run.depth); S.run.encounter={type:'item', item:it}; pushLog(dispName(it)+'が落ちている。'); }
  else if(r<0.70){ S.run.encounter={type:'trap'}; pushLog('宝箱を見つけた。罠があるかもしれない。'); }
  else if(r<0.90){ const mon=spawnMonster(S.run.depth); S.run.encounter={type:'enemy', mon}; pushLog(mon.name+'が現れた！'); }
  else { S.run.encounter={type:'stairs'}; pushLog('階段を見つけた。更に深く進めそうだ。'); }
  render();
}
function pickRandomDropKey(){
  if(Math.random()<0.12){ const seeds=['hpSeed','enSeed','skillSeed']; return seeds[Math.floor(Math.random()*seeds.length)]; }
  const pool=['club','dagger','sword','robe','exo','capsule','idScroll','curseFix','energyPotion'];
  return pool[Math.floor(Math.random()*pool.length)];
}
function spawnMonster(depth){
  const cands=MONSTERS.filter(m=>depth>=m.min&&depth<=m.max);
  const base=cands[Math.floor(Math.random()*cands.length)]||MONSTERS[0];
  return {name:base.name, hp:base.hp+depth*2, maxHp:base.hp+depth*2, atk:base.atk+Math.floor(depth/2),
          undead:base.undead, goldMin:base.gold[0], goldMax:base.gold[1]};
}
function renderEncounter(){
  const e=S.run.encounter;
  if(e.type==='item'){
    return `<button class="primary" onclick="takeItem()">拾う</button>
      <button class="ghost" onclick="leaveEncounter()">放っておく</button>`;
  }
  if(e.type==='trap'){
    return `<button class="primary" onclick="openChest()">開ける(技:${S.skill})</button>
      <button class="ghost" onclick="leaveEncounter()">触らない</button>`;
  }
  if(e.type==='enemy'){
    return `<button class="danger" onclick="enterCombat()">戦闘開始</button>
      <button class="ghost" onclick="fleeBeforeCombat()">戦わずに離れる</button>`;
  }
  if(e.type==='stairs'){
    const cost=S.run.depth+1;
    return `<button class="primary" onclick="descend(${cost})">降りる <span class="tag">エネルギー${cost}</span></button>
      <button class="ghost" onclick="leaveEncounter()">このまま探索を続ける</button>`;
  }
  return '';
}
function leaveEncounter(){ S.run.encounter=null; render(); }
function takeItem(){
  if(S.backpack.length>=S.backpackLimit){ toast('バックパックが満杯です'); return; }
  S.backpack.push(S.run.encounter.item); pushLog(dispName(S.run.encounter.item)+' を手に入れた。');
  S.run.encounter=null; render();
}
function openChest(){
  const chance=Math.max(0.1,Math.min(0.9, 0.5+S.skill*0.04-S.run.depth*0.03));
  if(Math.random()<chance){
    const it=genInstance(pickRandomDropKey(),S.run.depth);
    if(S.backpack.length<S.backpackLimit){ S.backpack.push(it); pushLog('解除成功。'+dispName(it)+' を手に入れた。'); }
    else pushLog('解除成功したが、バックパックが満杯で取れなかった。');
  } else {
    const kinds=['hp','energy']; if(!S.statusCursed) kinds.push('curse');
    const k=kinds[Math.floor(Math.random()*kinds.length)];
    if(k==='hp'){
      const d=Math.max(0,Math.min(S.hp-1, 3+S.run.depth*2)); S.hp-=d;
      pushLog('罠にかかった！ HPが'+d+'減った。');
    } else if(k==='energy'){
      const d=Math.max(0,Math.min(S.energy-1, 2+Math.floor(S.run.depth/2))); S.energy-=d;
      pushLog('罠にかかった！ エネルギーが'+d+'減った。');
    } else {
      S.statusCursed=true; S.atk=Math.max(1,S.atk-2); S.def=Math.max(0,S.def-1);
      pushLog('罠にかかった！ 呪いを受け、ATK -2・DEF -1。');
    }
  }
  S.run.encounter=null; render();
}
function descend(cost){
  if(S.energy<cost){ toast('エネルギーが足りません'); return; }
  S.energy-=cost; S.run.depth+=1; S.run.turns=0;
  S.maxDepthReached=Math.max(S.maxDepthReached, S.run.depth);
  pushLog('深層'+S.run.depth+'へ降りた。');
  S.run.encounter=null; render();
}
function fleeBeforeCombat(){ pushLog('戦わずにその場を離れた。'); S.run.encounter=null; render(); }
function doReturn(){
  const cost=returnCost();
  if(S.energy<cost){ toast('エネルギーが足りません(帰還には'+cost+'必要)'); return; }
  S.energy-=cost;
  S.maxDepthReached=Math.max(S.maxDepthReached,S.run.depth);
  S.run=null; S.screen='town'; render();
}
function collapse(){
  const lost = Math.ceil(S.gold/2);
  S.gold -= lost;
  S.hp=S.maxHp; S.energy=S.maxEnergy;
  if(S.run) S.maxDepthReached=Math.max(S.maxDepthReached, S.run.depth);
  S.statusCursed=false; S.combat=null;
  S.run=null; S.screen='town'; render();
  toast('回収業者に連れ戻された。所持金が半分になった(-'+lost+'G)。HP・エネルギーは全回復。');
}

// ===================== 戦闘 =====================
function enterCombat(){
  S.combat={mon:S.run.encounter.mon, fled:false};
  S.run.encounter=null; S.screen='combat'; render();
}
function weaponPower(){
  const w=S.equipment.weapon;
  if(!w||w.junk) return 0; // 素手
  return ITEMS[w.key].power * w.level;
}
function armorPower(){
  const a=S.equipment.armor;
  if(!a||a.junk) return 0;
  return Math.round(ITEMS[a.key].power*(1+((a.level||1)-1)*0.5));
}
function atkTotal(){ return S.atk + weaponPower(); }
function defTotal(){ return S.def + armorPower(); }
function renderCombat(){
  const m=S.combat.mon;
  return topbar('戦闘')+`<div class="panel" id="enemyBox">
    <div class="row"><span>${m.name}</span><span>HP ${m.hp}/${m.maxHp}${m.undead?' <span class="tag">アンデッド</span>':''}</span></div>
    <div class="statbar"><div class="hpfill" style="width:${Math.max(0,Math.round(m.hp/m.maxHp*100))}%"></div></div>
  </div>${statBlock()}
  <div class="panel">
    <button class="danger" onclick="combatAttack()">攻撃</button>
    <button onclick="openItems('combat')">アイテム</button>
    <button class="ghost" onclick="combatFlee()">逃げる</button>
  </div>`;
}
let busy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function shake(id){
  const el=document.getElementById(id); if(!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}
function pushLogSafe(msg){ if(S.run) pushLog(msg); }
async function enemyAct(){
  const m=S.combat.mon;
  if(m.hp<=0) return true;
  const dmg=Math.max(1, m.atk - defTotal());
  S.hp=Math.max(0,S.hp-dmg);
  pushLogSafe(m.name+'から'+dmg+'ダメージを受けた。');
  const ar=S.equipment.armor;
  if(ar && !ar.junk){
    const nm=dispName(ar);
    ar.durability=Math.max(0,ar.durability-1);
    if(ar.durability===0){ ar.junk=true; pushLogSafe(nm+'が壊れた。'); }
  }
  render(); shake('playerBox'); await sleep(600);
  if(S.hp<=0){ pushLogSafe('やられた…'); S.screen='dungeon'; collapse(); return false; }
  return true;
}
async function combatAttack(){
  if(busy||!S.combat) return; busy=true;
  try{
    const m=S.combat.mon;
    const dmg=Math.max(1, atkTotal() - Math.floor(Math.random()*3));
    m.hp-=dmg;
    const w=S.equipment.weapon;
    pushLogSafe(m.name+'に'+dmg+'ダメージ。');
    if(w && !w.junk){
      const nm=dispName(w);
      w.durability=Math.max(0,w.durability-1);
      if(w.durability===0){ w.junk=true; pushLogSafe(nm+'が壊れた。'); }
    }
    render(); shake('enemyBox'); await sleep(600);
    if(m.hp<=0){
      const gold = m.goldMin + Math.floor(Math.random()*(m.goldMax-m.goldMin+1));
      S.gold+=gold; pushLogSafe(m.name+'を倒した！ +'+gold+'G');
      S.combat=null; S.screen='dungeon'; render(); return;
    }
    if(await enemyAct()) render();
  } finally { busy=false; }
}
async function combatFlee(){
  if(busy||!S.combat) return; busy=true;
  try{
    if(Math.random()<0.7){ pushLogSafe('うまく逃げ切った。'); S.combat=null; S.screen='dungeon'; render(); return; }
    toast('逃げられなかった！');
    await sleep(400);
    if(await enemyAct()) render();
  } finally { busy=false; }
}

// ===================== アイテム画面(町・ダンジョン・戦闘共通) =====================
function openItems(ctx){ if(busy) return; S.itemCtx=ctx; S.itemSel=null; S.itemMode=null; S.screen='items'; render(); }
function closeItems(){ S.itemSel=null; S.itemMode=null; S.screen=S.itemCtx||'town'; render(); }
function selectItem(u){ S.itemSel=(S.itemSel===u)?null:u; render(); }
function note(msg){ toast(msg); }
function isEquipped(it){
  const w=S.equipment.weapon, a=S.equipment.armor;
  return (w&&w.uid===it.uid)||(a&&a.uid===it.uid);
}
function unequipItem(u){
  const w=S.equipment.weapon, a=S.equipment.armor;
  if(w&&w.uid===u) unequip('weapon'); else if(a&&a.uid===u) unequip('armor');
}
function actionPanel(it){
  const t=ITEMS[it.key].type, eq=isEquipped(it), inCombat=S.itemCtx==='combat';
  const canUse=!eq&&(t==='potion'||t==='tool'||t==='seed');
  const canEquip=(t==='weapon'||t==='armor');
  const st='style="text-align:center;margin:0"';
  let btns=`<button ${st} ${canUse?'':'disabled'} onclick="useOnSelf(${it.uid})">使う</button>`;
  if(inCombat) btns+=`<button ${st} ${eq?'disabled':''} onclick="throwAtEnemy(${it.uid})">投げる</button>`;
  btns+=`<button ${st} ${canEquip?'':'disabled'} onclick="${eq?`unequipItem(${it.uid})`:`equip(${it.uid})`}">${eq?'外す':'装備'}</button>`;
  return `<div style="display:grid;grid-template-columns:repeat(${inCombat?3:2},1fr);gap:6px;margin:0 0 8px">${btns}</div>`;
}
function itemDetail(it){
  const t=ITEMS[it.key].type;
  if((t==='weapon'||t==='armor') && it.identified) return ` <span class="tag">耐久${it.durability}/${it.maxDurability}</span>`;
  return '';
}
function targetOk(it){
  const m=S.itemMode; if(!m) return true;
  if(it.uid===m.src) return false;
  if(m.kind==='identify') return !it.identified || (it.cursed && !it.cursedRevealed);
  if(m.kind==='removeCurse'){ const t=ITEMS[it.key].type; return t==='weapon'||t==='armor'; }
  return false;
}
function cancelTool(){ S.itemMode=null; render(); }
function applyTool(tu){
  const m=S.itemMode; if(!m) return;
  const idx=S.backpack.findIndex(i=>i.uid===m.src);
  if(idx<0){ S.itemMode=null; render(); return; }
  const t=findAnyItem(tu); if(!t||!targetOk(t)) return;
  if(m.kind==='identify'){
    identifyItem(t);
    note(dispName(t)+'だと判明した。'+(t.cursed?'呪われている！':''));
  } else {
    if(uncurseItem(t)) note(dispName(t)+'の呪いが解けた。');
    else note(dispName(t)+'は呪われていなかった。');
  }
  S.backpack.splice(idx,1); S.itemMode=null; itemDone();
}
function renderItems(){
  const w=S.equipment.weapon, a=S.equipment.armor, mode=S.itemMode;
  const row=(it,label)=>{
    const txt=`${label?'['+label+'] ':''}${dispName(it)}${itemDetail(it)}${it.locked?' <span class="tag">呪い中</span>':''}${durBar(it)}`;
    if(mode) return `<button ${targetOk(it)?'':'disabled'} onclick="applyTool(${it.uid})">${txt}</button>`;
    const sel=S.itemSel===it.uid;
    return `<button onclick="selectItem(${it.uid})" ${sel?'style="border-style:double;border-width:3px"':''}>${txt}</button>`+(sel?actionPanel(it):'');
  };
  const eqHtml=(w?row(w,'武器'):'<div class="sub">武器: なし</div>')+(a?row(a,'防具'):'<div class="sub">防具: なし</div>');
  const list=S.backpack.map(it=>row(it,'')).join('');
  const modeHtml=mode?`<div class="panel"><p>${mode.kind==='identify'?'鑑定する対象を選んでください。':'呪いを解く対象を選んでください。'}</p><button class="ghost" onclick="cancelTool()">キャンセル</button></div>`:'';
  let enemy='';
  if(S.itemCtx==='combat'&&S.combat){
    const m=S.combat.mon;
    enemy=`<div class="panel"><div class="row"><span>${m.name}</span><span>HP ${m.hp}/${m.maxHp}${m.undead?' <span class="tag">アンデッド</span>':''}</span></div></div>`;
  }
  return topbar('持ち物')+modeHtml+enemy+statBlock()+`<div class="panel"><div class="sub">装備中</div>${eqHtml}</div>
   <div class="panel"><div class="sub">バックパック ${S.backpack.length}/${S.backpackLimit}</div>${list||'<p class="sub">何も持っていません</p>'}
   <button class="ghost" onclick="closeItems()">戻る</button></div>`;
}
function itemDone(){
  S.itemSel=null;
  if(S.itemCtx==='combat'&&S.combat) S.screen='combat';
  render();
}
function useOnSelf(u){
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0)return;
  const it=S.backpack[idx]; const b=ITEMS[it.key];
  if(b.type==='potion'){
    it.identified=true;
    if(it.effect==='heal'){ const heal=Math.min(S.maxHp-S.hp,15); S.hp+=heal; note(heal+'回復した。'); }
    else if(it.effect==='energy'){ const g=Math.min(S.maxEnergy-S.energy,10); S.energy+=g; note('エネルギーが'+g+'回復した。'); }
    else if(it.effect==='cureCurse'){
      if(S.statusCursed){ S.statusCursed=false; S.atk+=2; S.def+=1; note('呪いが解けた。'); }
      else note('特に変化はなかった。');
    } else { S.statusCursed=true; S.atk=Math.max(1,S.atk-2); S.def=Math.max(0,S.def-1); note('呪いの薬だった！ ATK -2・DEF -1'); }
    S.backpack.splice(idx,1);
  } else if(b.type==='seed'){
    const n=1+Math.floor(Math.random()*3);
    if(b.effect==='seedHp'){ S.maxHp+=n; S.hp+=n; note(b.name+'を使った！ 最大HPが'+n+'上がった。'); }
    else if(b.effect==='seedEn'){ S.maxEnergy+=n; S.energy+=n; note(b.name+'を使った！ 最大エネルギーが'+n+'上がった。'); }
    else { S.skill+=n; note(b.name+'を使った！ 技能が'+n+'上がった。'); }
    S.backpack.splice(idx,1);
  } else if(b.effect==='identify'||b.effect==='removeCurse'){
    S.itemMode={kind:b.effect,src:u};
    if(![...S.backpack,S.equipment.weapon,S.equipment.armor].filter(Boolean).some(targetOk)){
      S.itemMode=null; note(b.effect==='identify'?'鑑定する対象がない。':'対象にできる装備がない。'); return;
    }
    S.itemSel=null; render(); return;
  } else { return; }
  itemDone();
}
async function throwAtEnemy(u){
  if(busy||!S.combat) return;
  const idx=S.backpack.findIndex(i=>i.uid===u); if(idx<0)return;
  const it=S.backpack[idx]; const b=ITEMS[it.key]; const m=S.combat.mon;
  it.identified=true; S.backpack.splice(idx,1);
  const nm=dispName(it);
  let hit=false;
  if(b.type==='weapon'||b.type==='armor'){
    const dmg=Math.round((b.power||2)*(it.level||1)*1.2);
    m.hp-=dmg; hit=true; pushLogSafe(nm+'を投げつけた！ '+dmg+'ダメージ。');
  } else if(b.type==='potion'){
    if(it.effect==='heal'){
      if(m.undead){ m.hp-=15; hit=true; pushLogSafe(nm+'を浴びせた！ アンデッドに15ダメージ。'); }
      else { const g=Math.min(m.maxHp-m.hp,15); m.hp+=g; pushLogSafe(nm+'を投げつけた…敵が'+g+'回復してしまった。'); }
    } else if(it.effect==='curse'){
      const dmg=m.undead?2:8; m.hp-=dmg; hit=true; pushLogSafe(nm+'を投げつけた！ '+dmg+'ダメージ。');
    } else pushLogSafe(nm+'を投げつけたが、効果はなかった。');
  } else pushLogSafe(nm+'を投げつけたが、効果はなかった。');
  S.itemSel=null; S.screen='combat'; busy=true;
  try{
    render(); if(hit) shake('enemyBox');
    await sleep(hit?600:350);
    if(m.hp<=0){
      const gold=m.goldMin+Math.floor(Math.random()*(m.goldMax-m.goldMin+1));
      S.gold+=gold; pushLogSafe(m.name+'を倒した！ +'+gold+'G');
      S.combat=null; S.screen='dungeon'; render(); return;
    }
    if(await enemyAct()) render();
  } finally { busy=false; }
}

function renderGameover(){ return topbar('終了')+'<div class="panel">—</div>'; }

render();
</script>
